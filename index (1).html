function downloadImportSummary(s, name) {
  const f = r => r || [];
  downloadXlsx(`Import summary - ${String(name).replace(/\.[^.]+$/, '')}.xlsx`, [
    { name: 'Summary', rows: [
      ['File', s.file_name], ['Total rows', s.total_rows], ['Valid rows', s.valid_rows], ['Skipped rows (errors)', s.skipped_rows],
      ['New employees', f(s.new_employees).length], ['Updated employees', f(s.updated_employees).length],
      ['Manager changes', f(s.manager_changes).length], ['Marked inactive (left)', f(s.leavers).length],
      ['New managers', f(s.new_managers).length], ['Managers no longer managing', f(s.managers_dropped).length],
      ['Errors', s.error_count], ['Warnings', s.warning_count]].map(([k, val]) => ({ Item: k, Value: val })) },
    { name: 'New employees', rows: f(s.new_employees).map(x => ({ 'Employee ID': x.emp_code, Name: x.full_name, 'Manager ID': x.manager_code, 'Manager-only record': x.manager_only ? 'Yes' : '' })) },
    { name: 'Updated', rows: f(s.updated_employees).flatMap(x => Object.entries(x.changes).map(([k, c]) => ({ 'Employee ID': x.emp_code, Name: x.full_name, Field: k, From: c.from, To: c.to }))) },
    { name: 'Manager changes', rows: f(s.manager_changes).map(x => ({ 'Employee ID': x.emp_code, Name: x.full_name, 'From manager': x.from_name, 'From ID': x.from_code, 'To manager': x.to_name, 'To ID': x.to_code, 'Open draft': x.has_open_draft ? 'Yes' : '' })) },
    { name: 'Leavers', rows: f(s.leavers).map(x => ({ 'Employee ID': x.emp_code, Name: x.full_name, Department: x.parent_department })) },
    { name: 'Issues', rows: f(s.issues).map(i => ({ Row: i.row_no, 'Employee ID': i.emp_code, Severity: i.severity, Type: i.code, Message: i.message })) },
  ]);
}

async function handleFile(f) {
  const out = qs('#result');
  render(out, html`<div class="card card-pad muted">Reading ${f.name}…</div>`);
  let parsed, sheetName;
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { cellDates: false });
    const sheets = wb.SheetNames.map(n => ({ name: n, aoa: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: null, raw: false, blankrows: false }) }));
    const pick = pickSheet(sheets); sheetName = pick.name;
    parsed = rowsFromSheet(pick.aoa);
  } catch (e) { return render(out, html`<div class="banner err">Could not read the file: ${e.message}</div>`); }
  if (parsed.error || parsed.missing?.length) {
    return render(out, html`<div class="card card-pad stack"><div class="banner err"><div><b>The file is missing required columns:</b> ${(parsed.missing || []).join(', ') || parsed.error}</div></div>
      <div class="muted small">Sheet used: ${sheetName}. Expected headers such as “Employee ID” / “Emp. Code”, “Employee Name”, “LM Code” / “Manager Employee ID” or “Manager Email”. Download the template for the recommended format.</div></div>`);
  }
  render(out, html`<div class="card card-pad muted">Checking ${parsed.rows.length} rows against the database…</div>`);
  let s;
  try { s = await api.importPreview(f.name, parsed.rows); }
  catch (e) { return render(out, html`<div class="banner err">${e.message}</div>`); }
  renderPreview(out, s, parsed, sheetName);
}

function renderPreview(out, s, parsed, sheetName) {
  const infos = s.issues.filter(i => i.severity === 'info');
  const tiles = [
    ['total', 'Rows in file', s.total_rows], ['new', 'New employees', s.new_employees.length], ['upd', 'Updated', s.updated_employees.length],
    ['mgr', 'Manager changes', s.manager_changes.length], ['left', 'Will be marked inactive', s.leavers.length],
    ['react', 'Status changes', s.reactivated.length + s.marked_inactive_in_file.length],
    ['nm', 'New managers', s.new_managers.length], ['dm', 'No longer managing', s.managers_dropped.length],
    ['err', 'Errors (rows skipped)', s.error_count, 'err'], ['warn', 'Warnings', s.warning_count, 'warn'], ['info', 'Notes', infos.length],
  ];
  render(out, html`<div class="card"><div class="card-head"><div><h2>Import preview — ${s.file_name}</h2>
      <div class="muted small">Sheet “${sheetName}”, header on row ${parsed.headerRow} · ${s.valid_rows} valid rows · ${s.total_managers_after} line managers detected${parsed.ignored ? ` · ${parsed.ignored} non-employee rows ignored` : ''}</div></div>
      <button class="btn sm" id="dl">Download summary ⇩</button></div>
    <div class="card-pad stack">
      <details><summary class="small" style="cursor:pointer">Column mapping used</summary><div class="mapping" style="margin-top:8px">
        ${Object.entries(parsed.mapping).map(([k, col]) => html`<div><span class="muted">${FIELD_LABELS[k]}</span><b>${col}</b></div>`)}</div></details>
      ${s.mass_deactivation ? html`<div class="banner err"><div><b>Check this file.</b> It would mark ${s.leavers.length} of ${s.active_before} active employees as inactive. That usually means a partial or wrong sheet.</div></div>` : ''}
      ${s.error_count ? html`<div class="banner warn"><div><b>${s.skipped_rows} rows have errors and will be skipped.</b> Their existing records stay unchanged. Fix them in the sheet and re-upload, or import the valid rows now.</div></div>` : html`<div class="banner ok">No blocking errors found.</div>`}
      <div class="diff-grid">${tiles.map(([k, l, n, cls]) => html`<button class="diff-tile ${cls && n ? cls : ''}" data-k="${k}"><div class="n">${n}</div><div class="l">${l}</div></button>`)}</div>
      <div id="detail"></div>
      <div class="stack" style="border-top:1px solid var(--line);padding-top:16px">
        ${s.error_count ? html`<label class="check"><input type="checkbox" id="acc1"> <span>Skip the ${s.skipped_rows} rows with errors and import the rest</span></label>` : ''}
        ${s.mass_deactivation ? html`<label class="check"><input type="checkbox" id="acc2"> <span>I confirm ${s.leavers.length} employees have left and should be marked inactive</span></label>` : ''}
        <div class="row"><button class="btn primary" id="ok">Confirm and import</button><button class="btn" id="cancel">Cancel import</button>
          <span class="muted small">Assessments are never deleted. Leavers are marked inactive and their history is kept.</span></div>
      </div>
    </div></div>`);

  const detail = qs('#detail', out);
  const list = (rows, cols) => rows.length ? html`<div class="table-wrap" style="max-height:360px;border:1px solid var(--line);border-radius:8px"><table><thead><tr>${cols.map(c => html`<th>${c[0]}</th>`)}</tr></thead>
    <tbody>${rows.map(r => html`<tr>${cols.map(c => html`<td>${c[1](r)}</td>`)}</tr>`)}</tbody></table></div>` : html`<div class="muted small">Nothing in this group.</div>`;
  const show = k => {
    qsa('.diff-tile', out).forEach(t => t.classList.toggle('sel', t.dataset.k === k));
    const issues = sev => list(s.issues.filter(i => i.severity === sev), [['Row', i => i.row_no], ['Employee ID', i => i.emp_code], ['Issue', i => i.message]]);
    const views = {
      total: () => html`<div class="muted small">${s.valid_rows} of ${s.total_rows} rows are valid. Click a tile to see the details.</div>`,
      new: () => list(s.new_employees, [['ID', x => x.emp_code], ['Name', x => html`${x.full_name} ${x.manager_only ? html`<span class="chip info">manager only</span>` : ''}`], ['Reports to', x => x.manager_code]]),
      upd: () => list(s.updated_employees, [['ID', x => x.emp_code], ['Name', x => x.full_name], ['Changes', x => html`${Object.entries(x.changes).map(([f, c]) => html`<div class="small"><b>${f.replace('_', ' ')}</b>: ${c.from ?? '—'} → ${c.to ?? '—'}</div>`)}`]]),
      mgr: () => list(s.manager_changes, [['ID', x => x.emp_code], ['Name', x => x.full_name], ['From', x => x.from_name || x.from_code || '—'], ['To', x => x.to_name || x.to_code || '—'], ['', x => x.has_open_draft ? html`<span class="chip warn">open draft moves to new manager</span>` : '']]),
      left: () => list(s.leavers, [['ID', x => x.emp_code], ['Name', x => x.full_name], ['Department', x => x.parent_department]]),
      react: () => list([...s.reactivated, ...s.marked_inactive_in_file.map(x => ({ ...x, inactive: true }))], [['ID', x => x.emp_code], ['Name', x => x.full_name], ['Change', x => x.inactive ? 'Marked inactive in file' : 'Reactivated']]),
      nm: () => list(s.new_managers, [['ID', x => x.emp_code], ['Name', x => x.full_name], ['Direct reports', x => x.reports]]),
      dm: () => list(s.managers_dropped, [['ID', x => x.emp_code], ['Name', x => x.full_name]]),
      err: () => issues('error'), warn: () => issues('warning'), info: () => issues('info'),
    };
    render(detail, views[k]());
  };
  show(s.error_count ? 'err' : s.manager_changes.length ? 'mgr' : 'new');
  qs('.diff-grid', out).onclick = ev => { const t = ev.target.closest('[data-k]'); if (t) show(t.dataset.k); };
  qs('#dl', out).onclick = () => downloadImportSummary(s, s.file_name);
  qs('#cancel', out).onclick = async () => { await api.importCancel(s.batch_id); out.innerHTML = ''; toast('Import cancelled'); drawHistory(); };
  qs('#ok', out).onclick = async ev => {
    const a1 = qs('#acc1', out), a2 = qs('#acc2', out);
    if (a1 && !a1.checked) return toast('Tick the box to skip rows with errors, or fix the file first', 'err');
    if (a2 && !a2.checked) return toast('Confirm the mass deactivation, or cancel and check the file', 'err');
    try {
      const r = await busy(ev.currentTarget, () => api.importCommit(s.batch_id, !!a1?.checked, !!a2?.checked));
      S.cache = {};
      render(out, html`<div class="banner ok"><div><b>Import applied.</b> ${s.new_employees.length} new, ${s.updated_employees.length} updated, ${s.manager_changes.length} manager changes, ${r.deactivated} marked inactive. Manager dashboards are updated.</div></div>`);
      toast('HR master imported'); drawHistory();
    } catch (er) { toast(er.message, 'err'); }
  };
}

// ------------------------------------------------------------------ ADMIN: assessments
async function adminAssessments() {
  const v = shell('assessments', 'Assessments', 'All assessments in the selected cycle. Open one to view it or reopen it for correction.');
  render(v, html`<div class="muted">Loading…</div>`);
  const rows = await api.exportRows(S.cycleId, true);
  const by = new Map();
  rows.forEach(r => { const k = r.employee_code; if (!by.has(k)) by.set(k, { ...r, skills: [] }); if (r.soft_skill) by.get(k).skills.push(r.soft_skill); });
  const list = [...by.values()];
  render(v, html`<div class="card"><div class="card-head"><div class="row">
      <input type="search" id="q" placeholder="Search employee or manager…" style="width:240px">
      <select id="st" style="width:auto"><option value="">All statuses</option><option value="submitted">Submitted</option><option value="draft">Draft</option><option value="not_started">Not started</option></select>
      <select id="dept" style="width:auto"><option value="">All departments</option>${uniq(list.map(r => r.parent_department)).map(d => html`<option>${d}</option>`)}</select></div>
      <span class="muted small" id="cnt"></span></div>
    <div class="table-wrap" style="max-height:640px"><table><thead><tr><th>Employee</th><th>Department</th><th>Assessed by</th><th>Soft skills</th><th>Status</th><th>Submitted</th></tr></thead><tbody id="tb"></tbody></table></div></div>`);
  const draw = () => {
    const q = qs('#q').value.toLowerCase(), st = qs('#st').value, dept = qs('#dept').value;
    const f = list.filter(r => (!st || r.assessment_status === st) && (!dept || r.parent_department === dept)
      && (!q || [r.employee_name, r.employee_code, r.manager_name].join(' ').toLowerCase().includes(q)));
    qs('#cnt').textContent = `${f.length} of ${list.length}`;
    render(qs('#tb'), html`${f.slice(0, 600).map(r => html`<tr class="${r.assessment_status === 'not_started' ? '' : 'clickable'}" data-code="${r.employee_code}" data-st="${r.assessment_status}">
      <td><b>${r.employee_name}</b><div class="sub">${r.employee_code} · ${r.job_title || ''}</div></td><td>${r.parent_department}<div class="sub">${r.sub_department}</div></td>
      <td>${r.manager_name}</td><td class="small">${r.skills.join(', ')}</td><td>${chip(r.assessment_status)}</td><td class="nowrap">${fmtDay(r.submission_date)}</td></tr>`)}`);
  };
  draw(); qs('#q').oninput = debounce(draw, 120); qs('#st').onchange = draw; qs('#dept').onchange = draw;
  qs('#tb').onclick = async ev => {
    const tr = ev.target.closest('tr[data-code]'); if (!tr || tr.dataset.st === 'not_started') return;
    const data = await api.getAssessment(S.cycleId, tr.dataset.code);
    data.can_edit = false;
    const m = modal({ title: 'Assessment', wide: true, body: html`<div id="ab"></div>`,
      foot: data.assessment?.status === 'submitted' ? html`<button class="btn danger" id="reopen">Reopen for correction</button>` : '' });
    renderAssessmentForm(qs('#ab', m.root), data, { readOnlyNote: data.assessment?.status === 'submitted' ? 'Administrator view.' : 'Draft — the line manager has not submitted yet.' });
    const rb = qs('#reopen', m.root);
    if (rb) rb.onclick = async () => {
      if (!await confirmBox('Reopen assessment?', 'The line manager will be able to edit and resubmit it. This is recorded in the audit log.', 'Reopen', true)) return;
      try { await api.reopen(data.assessment.id, 'Reopened by administrator'); m.close(); toast('Assessment reopened'); adminAssessments(); } catch (er) { toast(er.message, 'err'); }
    };
  };
}

// ------------------------------------------------------------------ ADMIN: export
const EXPORT_COLS = [
  ['Assessment Cycle', r => r.assessment_cycle], ['Submission Date', r => r.submission_date ? fmtDate(r.submission_date) : ''],
  ['Manager Employee ID', r => r.manager_code], ['Manager Name', r => r.manager_name],
  ['Employee ID', r => r.employee_code], ['Employee Name', r => r.employee_name],
  ['Department', r => r.parent_department], ['Sub-Department', r => r.sub_department], ['Designation', r => r.job_title],
  ['Skill #', r => r.skill_no], ['Competency', r => r.soft_skill], ['Current Proficiency', r => r.current_proficiency],
  ['Required Proficiency', r => r.target_proficiency], ['Skill Gap', r => r.skill_gap], ['Training Requirement', r => r.training_requirement],
  ['Why Essential', r => r.why_essential], ['Technical Skill', r => r.technical_skill], ['Manager Comments', r => r.manager_comments],
  ['Assessment Status', r => STATUS[r.assessment_status]?.[1] || r.assessment_status],
];
async function adminExport() {
  const v = shell('export', 'Export', 'Download TNA responses to Excel for analysis in Excel or Power BI. One row per employee per soft skill.');
  render(v, html`<div class="muted">Loading…</div>`);
  const load = async (cyc) => api.exportRows(cyc || null, !!cyc);
  let rows = await load(S.cycleId);
  render(v, html`<div class="stack"><div class="card card-pad"><div class="form-grid">
      <label class="f"><span>Assessment cycle</span><select id="x_cycle"><option value="">All cycles</option>${S.cat.cycles.map(c => html`<option value="${c.id}" ${c.id === S.cycleId ? 'selected' : ''}>${c.name}</option>`)}</select></label>
      <label class="f"><span>Department</span><select id="x_dept"></select></label>
      <label class="f"><span>Line manager</span><select id="x_mgr"></select></label>
      <label class="f"><span>Employee</span><input type="search" id="x_emp" placeholder="Name or ID"></label>
      <label class="f"><span>Competency</span><select id="x_skill"></select></label>
      <label class="f"><span>Status</span><select id="x_st"><option value="">Submitted + drafts</option><option value="submitted">Submitted only</option><option value="draft">Drafts only</option><option value="not_started">Not started (chase list)</option><option value="all">Everything</option></select></label>
    </div></div>
    <div class="card"><div class="card-head"><b id="x_cnt"></b><button class="btn lime" id="x_dl">Download Excel ⇩</button></div>
      <div class="table-wrap" style="max-height:480px"><table><thead><tr>${EXPORT_COLS.map(c => html`<th>${c[0]}</th>`)}</tr></thead><tbody id="x_tb"></tbody></table></div></div></div>`);
  const fillOpts = () => {
    const o = (id, vals, all) => { const el = qs(id); const cur = el.value; render(el, html`<option value="">${all}</option>${vals.map(x => html`<option value="${x[0]}" ${x[0] === cur ? 'selected' : ''}>${x[1]}</option>`)}`); };
    o('#x_dept', uniq(rows.map(r => r.parent_department)).map(d => [d, d]), 'All departments');
    const mg = new Map(rows.map(r => [r.manager_code, r.manager_name])); o('#x_mgr', [...mg].filter(x => x[0]).sort((a, b) => String(a[1]).localeCompare(String(b[1]))), 'All managers');
    o('#x_skill', uniq(rows.map(r => r.soft_skill)).map(s => [s, s]), 'All competencies');
  };
  const filtered = () => {
    const d = qs('#x_dept').value, m = qs('#x_mgr').value, e = qs('#x_emp').value.toLowerCase(), sk = qs('#x_skill').value, st = qs('#x_st').value;
    return rows.filter(r => (!d || r.parent_department === d) && (!m || r.manager_code === m) && (!sk || r.soft_skill === sk)
      && (!e || (r.employee_name + ' ' + r.employee_code).toLowerCase().includes(e))
      && (st === 'all' || (st ? r.assessment_status === st : r.assessment_status !== 'not_started')));
  };
  const draw = () => {
    const f = filtered();
    qs('#x_cnt').textContent = `${f.length} rows · ${new Set(f.map(r => r.employee_code)).size} employees`;
    render(qs('#x_tb'), f.length ? html`${f.slice(0, 100).map(r => html`<tr>${EXPORT_COLS.map(c => html`<td class="small">${c[1](r)}</td>`)}</tr>`)}
      ${f.length > 100 ? html`<tr><td colspan="${EXPORT_COLS.length}" class="muted small">Preview shows the first 100 rows — the download includes all ${f.length}.</td></tr>` : ''}`
      : html`<tr><td colspan="${EXPORT_COLS.length}" class="empty">No rows match these filters.</td></tr>`);
  };
  fillOpts(); draw();
  qsa('#x_dept,#x_mgr,#x_skill,#x_st').forEach(el => el.onchange = draw);
  qs('#x_emp').oninput = debounce(draw, 150);
  qs('#x_cycle').onchange = async ev => { rows = await load(ev.target.value); fillOpts(); draw(); };
  qs('#x_dl').onclick = () => {
    const f = filtered();
    const cyc = S.cat.cycles.find(c => c.id === qs('#x_cycle').value)?.name || 'All cycles';
    downloadXlsx(`TNA Export - ${cyc} - ${new Date().toISOString().slice(0, 10)}.xlsx`,
      [{ name: 'TNA Responses', rows: f.map(r => Object.fromEntries(EXPORT_COLS.map(([h, fn]) => [h, fn(r) ?? '']))) }]);
  };
}

// ------------------------------------------------------------------ ADMIN: settings
async function adminSettings() {
  const v = shell('settings', 'Settings', 'Configure cycles, competencies, rating scale and administrators — no code changes needed.');
  const tabs = [['cycles', 'Assessment cycles'], ['soft', 'Soft skills'], ['technical', 'Technical skills'], ['reasons', 'Reasons'], ['levels', 'Proficiency scale'], ['admins', 'Administrators']];
  S.settingsTab = S.settingsTab || 'cycles';
  render(v, html`<div class="tabs" role="tablist">${tabs.map(([k, l]) => html`<button role="tab" data-t="${k}" class="${S.settingsTab === k ? 'active' : ''}">${l}</button>`)}</div><div id="st"></div>`);
  qs('.tabs', v).onclick = ev => { const b = ev.target.closest('[data-t]'); if (b) { S.settingsTab = b.dataset.t; adminSettings(); } };
  const box = qs('#st', v);
  const reloadCat = async () => { S.cat = await api.catalog(); adminSettings(); };
  const t = S.settingsTab;

  const editor = (title, fields, row, table) => {
    const m = modal({ title, body: html`<div class="form-grid">${fields.map(f => html`<label class="f" style="${f.wide ? 'grid-column:1/-1' : ''}"><span>${f.label}</span>
      ${f.type === 'select' ? html`<select data-k="${f.key}">${f.options.map(o => html`<option value="${o[0]}" ${String(row[f.key] ?? '') === String(o[0]) ? 'selected' : ''}>${o[1]}</option>`)}</select>`
        : f.type === 'textarea' ? html`<textarea data-k="${f.key}">${row[f.key] || ''}</textarea>`
        : html`<input type="${f.type || 'text'}" data-k="${f.key}" value="${row[f.key] ?? ''}" ${f.readonly ? 'disabled' : ''}>`}</label>`)}</div>`,
      foot: html`<button class="btn primary" id="sv">Save</button>` });
    qs('#sv', m.root).onclick = async ev => {
      const out = { ...row };
      qsa('[data-k]', m.root).forEach(el => { const f = fields.find(x => x.key === el.dataset.k);
        let val = el.value.trim(); out[f.key] = f.type === 'number' ? (val === '' ? null : +val) : f.bool ? val === 'true' : (val || null); });
      try { await busy(ev.currentTarget, () => api.saveConfig(table, out)); m.close(); toast('Saved'); reloadCat(); } catch (er) { toast(er.message, 'err'); }
    };
  };
  const activeOpt = [['true', 'Active'], ['false', 'Hidden from forms']];

  if (t === 'cycles') {
    const fields = [{ key: 'name', label: 'Name' }, { key: 'status', label: 'Status', type: 'select', options: [['draft', 'Draft (not visible to managers)'], ['open', 'Open for assessment'], ['closed', 'Closed (read only)']] },
      { key: 'max_soft_skills', label: 'Max soft skills per employee', type: 'number' }, { key: 'opens_on', label: 'Opens on', type: 'date' }, { key: 'closes_on', label: 'Closes on', type: 'date' }];
    render(box, html`<div class="card"><div class="card-head"><span class="muted small">Managers only see open cycles. Closing a cycle locks all its assessments.</span><button class="btn primary sm" id="new">+ New cycle</button></div>
      <table><thead><tr><th>Cycle</th><th>Status</th><th>Max skills</th><th>Window</th><th></th></tr></thead><tbody>
      ${S.cat.cycles.map(c => html`<tr><td><b>${c.name}</b></td><td>${chip(c.status)}</td><td>${c.max_soft_skills}</td><td class="small">${fmtDay(c.opens_on)} – ${fmtDay(c.closes_on)}</td><td class="right"><button class="btn sm" data-id="${c.id}">Edit</button></td></tr>`)}</tbody></table></div>`);
    qs('#new', box).onclick = () => editor('New cycle', fields, { status: 'draft', max_soft_skills: 3 }, 'cycles');
    box.onclick = ev => { const b = ev.target.closest('[data-id]'); if (b) editor('Edit cycle', fields, { ...S.cat.cycles.find(c => c.id === b.dataset.id), __existing: true }, 'cycles'); };
  }
  if (t === 'soft' || t === 'technical') {
    const list = S.cat.skills.filter(s => s.kind === t);
    const fields = [{ key: 'name', label: 'Name' }, { key: 'sort_order', label: 'Display order', type: 'number' },
      { key: 'active', label: 'Status', type: 'select', options: activeOpt, bool: true }, { key: 'description', label: 'Description (shown to managers)', type: 'textarea', wide: true }];
    render(box, html`<div class="card"><div class="card-head"><span class="muted small">Hidden skills stay on past assessments but can’t be picked on new ones.</span><button class="btn primary sm" id="new">+ Add skill</button></div>
      <table><thead><tr><th>#</th><th>Skill</th><th>Description</th><th>Status</th><th></th></tr></thead><tbody>
      ${list.map(s => html`<tr><td>${s.sort_order}</td><td><b>${s.name}</b></td><td class="small muted">${s.description || ''}</td><td>${s.active ? chip('active') : html`<span class="chip muted">Hidden</span>`}</td><td class="right"><button class="btn sm" data-id="${s.id}">Edit</button></td></tr>`)}</tbody></table></div>`);
    qs('#new', box).onclick = () => editor('Add skill', fields, { kind: t, active: true, sort_order: list.length + 1 }, 'skills');
    box.onclick = ev => { const b = ev.target.closest('[data-id]'); if (b) editor('Edit skill', fields, { ...list.find(s => s.id === b.dataset.id), __existing: true }, 'skills'); };
  }
  if (t === 'reasons') {
    const fields = [{ key: 'label', label: 'Reason' }, { key: 'sort_order', label: 'Display order', type: 'number' }, { key: 'active', label: 'Status', type: 'select', options: activeOpt, bool: true }];
    render(box, html`<div class="card"><div class="card-head"><span class="muted small">Options for “Why are these skills essential for the role?”</span><button class="btn primary sm" id="new">+ Add reason</button></div>
      <table><tbody>${S.cat.reasons.map(r => html`<tr><td><b>${r.label}</b></td><td>${r.active ? chip('active') : html`<span class="chip muted">Hidden</span>`}</td><td class="right"><button class="btn sm" data-id="${r.id}">Edit</button></td></tr>`)}</tbody></table></div>`);
    qs('#new', box).onclick = () => editor('Add reason', fields, { active: true, sort_order: S.cat.reasons.length + 1 }, 'reasons');
    box.onclick = ev => { const b = ev.target.closest('[data-id]'); if (b) editor('Edit reason', fields, { ...S.cat.reasons.find(r => r.id === b.dataset.id), __existing: true }, 'reasons'); };
  }
  if (t === 'levels') {
    const fields = [{ key: 'level', label: 'Level number', type: 'number' }, { key: 'label', label: 'Label' }, { key: 'description', label: 'Description', type: 'textarea', wide: true }];
    render(box, html`<div class="card"><div class="card-head"><span class="muted small">Target proficiency must be higher than current. To move to a 1–5 scale, add levels 4 and 5 and relabel.</span><button class="btn primary sm" id="new">+ Add level</button></div>
      <table><tbody>${S.cat.levels.map(l => html`<tr><td style="width:60px"><b>${l.level}</b></td><td><b>${l.label}</b><div class="sub">${l.description || ''}</div></td><td class="right"><button class="btn sm" data-id="${l.level}">Edit</button></td></tr>`)}</tbody></table></div>`);
    qs('#new', box).onclick = () => editor('Add level', fields, { level: S.cat.levels.length + 1 }, 'proficiency_levels');
    box.onclick = ev => { const b = ev.target.closest('[data-id]'); if (b) editor('Edit level', fields.map(f => f.key === 'level' ? { ...f, readonly: true } : f), { ...S.cat.levels.find(l => l.level === +b.dataset.id), __existing: true }, 'proficiency_levels'); };
  }
  if (t === 'admins') {
    const admins = await api.admins();
    render(box, html`<div class="card"><div class="card-head"><form id="af" class="row"><input type="email" required placeholder="email@company.com" style="width:260px"><button class="btn primary sm">Add administrator</button></form></div>
      <table><tbody>${admins.map(a => html`<tr><td><b>${a.email}</b><div class="sub">Added ${fmtDay(a.added_at)}${a.added_by ? ' by ' + a.added_by : ''}</div></td><td class="right"><button class="btn sm danger" data-rm="${a.email}">Remove</button></td></tr>`)}</tbody></table></div>`);
    qs('#af', box).onsubmit = async ev => { ev.preventDefault(); try { await api.addAdmin(qs('input', ev.target).value); toast('Administrator added'); adminSettings(); } catch (er) { toast(er.message, 'err'); } };
    box.onclick = async ev => { const b = ev.target.closest('[data-rm]'); if (b && await confirmBox('Remove administrator?', `${b.dataset.rm} will lose admin access.`, 'Remove', true)) {
      try { await api.removeAdmin(b.dataset.rm); toast('Removed'); adminSettings(); } catch (er) { toast(er.message, 'err'); } } };
  }
}

// ------------------------------------------------------------------ ADMIN: audit
async function adminAudit() {
  const v = shell('audit', 'Audit Log', 'Latest 300 administrative changes, imports and reopenings.');
  const rows = await api.auditLog();
  render(v, html`<div class="card"><div class="table-wrap" style="max-height:700px"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Record</th><th>Details</th></tr></thead><tbody>
    ${rows.length ? rows.map(r => html`<tr><td class="nowrap small">${fmtDate(r.at)}</td><td class="small">${r.actor_email || 'system'}</td><td><b>${r.action}</b></td><td class="small">${r.entity}<div class="sub">${r.entity_id}</div></td>
      <td class="small"><details><summary style="cursor:pointer">view</summary><pre style="white-space:pre-wrap;max-width:520px;font-size:11.5px">${JSON.stringify(r.details, null, 1)}</pre></details></td></tr>`)
      : html`<tr><td colspan="5" class="empty">No entries yet.</td></tr>`}</tbody></table></div></div>`);
}

boot().catch(e => renderFatal(e.message));
