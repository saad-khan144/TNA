  <script type="module">
// ---- js/hr-import.js
// HR master sheet reader — turns an Excel sheet (array of arrays) into the
// row objects that import_preview() expects. Works in the browser and in Node.
// The database re-validates everything; this only maps columns.

const ALIASES = {
  emp_code:          ['emp code', 'employee code', 'employee id', 'emp id', 'employee no', 'employee number', 'staff id'],
  full_name:         ['employee name', 'name', 'full name', 'employee full name'],
  email:             ['official email address', 'employee email', 'employee email address', 'official email', 'work email', 'email'],
  job_title:         ['job title', 'designation', 'position', 'title'],
  parent_department: ['parent department', 'department', 'dept'],
  sub_department:    ['sub department', 'subdepartment', 'team', 'section'],
  manager_code:      ['lm code', 'manager employee id', 'manager id', 'manager code', 'line manager code', 'line manager id', 'lm id', 'reporting manager id'],
  manager_name:      ['line manager name', 'manager name', 'line manager', 'reporting manager', 'lm name'],
  manager_email:     ['manager email', 'line manager email', 'lm email', 'manager email address', 'reporting manager email'],
  status:            ['employment status', 'status', 'employee status'],
};

const FIELD_LABELS = {
  emp_code: 'Employee ID', full_name: 'Employee Name', email: 'Employee Email',
  job_title: 'Job Title / Designation', parent_department: 'Department', sub_department: 'Sub-Department',
  manager_code: 'Manager Employee ID', manager_name: 'Line Manager Name', manager_email: 'Manager Email',
  status: 'Employment Status',
};

function normHeader(h) {
  return String(h ?? '').toLowerCase().replace(/[\r\n]+/g, ' ').replace(/[._\-/()#:]+/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

function mapHeaders(headers) {
  const norm = headers.map(normHeader);
  const mapping = {};
  for (const [field, names] of Object.entries(ALIASES)) {
    for (const name of names) {
      const i = norm.findIndex((h, idx) => h === name && !Object.values(mapping).includes(idx));
      if (i >= 0) { mapping[field] = i; break; }
    }
  }
  // "Email Address" is ambiguous. In the 2026 TNA master it sits next to
  // "Line Manager Name" and holds the manager's email, while
  // "Official Email Address" holds the employee's.
  const plain = norm.findIndex((h, idx) => h === 'email address' && !Object.values(mapping).includes(idx));
  if (plain >= 0) {
    if (mapping.email !== undefined && mapping.manager_email === undefined) mapping.manager_email = plain;
    else if (mapping.email === undefined) mapping.email = plain;
  }
  const missing = [];
  if (mapping.emp_code === undefined) missing.push('Employee ID');
  if (mapping.full_name === undefined) missing.push('Employee Name');
  if (mapping.manager_code === undefined && mapping.manager_email === undefined)
    missing.push('Manager Employee ID or Manager Email');
  return { mapping, missing, score: Object.keys(mapping).length };
}

// Find the header row in the first 20 rows of a sheet.
function findHeader(aoa) {
  let best = { row: -1, score: 0 };
  for (let r = 0; r < Math.min(aoa.length, 20); r++) {
    const m = mapHeaders(aoa[r] || []);
    if (m.score > best.score) best = { row: r, score: m.score, ...m };
  }
  return best;
}

const clean = v => (v === null || v === undefined) ? null : (String(v).trim() || null);

function rowsFromSheet(aoa) {
  const h = findHeader(aoa);
  if (h.row < 0 || h.score < 3) return { error: 'No recognisable header row found', rows: [] };
  const rows = [];
  let ignored = 0;
  for (let r = h.row + 1; r < aoa.length; r++) {
    const src = aoa[r] || [];
    const o = { _row: r + 1 };
    for (const [field, idx] of Object.entries(h.mapping)) o[field] = clean(src[idx]);
    if (!o.emp_code && !o.full_name) { if (src.some(v => clean(v))) ignored++; continue; }
    rows.push(o);
  }
  return {
    headerRow: h.row + 1,
    mapping: Object.fromEntries(Object.entries(h.mapping).map(([f, i]) => [f, String((aoa[h.row] || [])[i] ?? '')])),
    missing: h.missing, rows, ignored,
  };
}

// Pick the sheet that looks most like an HR master (hidden sheets included).
function pickSheet(sheets /* [{name, aoa}] */) {
  let best = null;
  for (const s of sheets) {
    const h = findHeader(s.aoa);
    const dataRows = s.aoa.length - h.row - 1;
    const score = h.score * 1000 + Math.min(dataRows, 999);
    if (!best || score > best.score) best = { ...s, score, headerScore: h.score };
  }
  return best;
}

// ---- js/demo.js
// In-memory demo backend with dummy data. Used only when config.js has no
// SUPABASE_URL. Mirrors the database functions closely enough to click
// through every screen; nothing is stored and there is no real security.

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
const now = () => new Date().toISOString();
const clone = o => JSON.parse(JSON.stringify(o));
const wait = (v) => new Promise(r => setTimeout(() => r(clone(v)), 120));
const fail = (m) => new Promise((_, rej) => setTimeout(() => rej(new Error(m)), 120));

const SOFT = [
  ['Interpersonal Communication', 'Exchanging information clearly and actively listening to ensure mutual understanding across all levels.'],
  ['Business Writing', 'Crafting professional, concise, and purposeful emails, reports, and documents for internal and external stakeholders.'],
  ['Presentation Skills', 'Delivering information confidently and persuasively to an audience using clear visuals and engaging narratives.'],
  ['Emotional Intelligence', 'Recognizing and managing your own emotions while empathetically navigating the emotions of others to build trust.'],
  ['Conflict Management', 'Addressing disagreements constructively and finding "win-win" solutions to maintain a positive team dynamic.'],
  ['Time Management', 'Prioritizing tasks effectively and organizing schedules to meet deadlines without compromising quality.'],
  ['Problem Solving', 'Analyzing challenges objectively to identify root causes and implement sustainable, logical solutions.'],
  ['Stakeholder Management', 'Identifying and balancing the needs of everyone involved in a project to ensure successful delivery and alignment.'],
  ['Leadership', "Guiding and inspiring others toward a common goal while taking accountability for the team's performance."],
  ['Team Collaboration', 'Working seamlessly with others, sharing knowledge, and supporting peers to achieve collective business objectives.'],
  ['Feedback & Coaching', 'Providing and receiving constructive insights to foster continuous professional growth and skill development.'],
  ['Ownership & Accountability', null], ['Task & Priority Management', null],

function createDemoApi() {
  const db = seed();
  let me = null; // email

  const myCode = () => db.employees.find(e => e.email === me && e.status === 'active')?.emp_code;

  const log = (action, entity, entity_id, details) => db.audit.unshift({ id: db.audit.length + 1, at: now(), actor_email: me, action, entity, entity_id, details });
  const requireAdmin = () => { if (!isAdmin()) throw new Error('Administrator access required'); };

  function getA(cycleId, code) {
    const e = byCode(code); const a = db.assessments.find(x => x.cycle_id === cycleId && x.employee_code === code);
    const m = byCode(a?.manager_code || e.manager_code);
    const cyc = db.cycles.find(c => c.id === cycleId);
    return {
      employee: { emp_code: e.emp_code, full_name: a?.snap_employee_name || e.full_name, job_title: a?.snap_job_title || e.job_title,
        parent_department: a?.snap_parent_department || e.parent_department, sub_department: a?.snap_sub_department || e.sub_department,
        manager_name: a?.snap_manager_name || m?.full_name, manager_code: m?.emp_code },
      assessment: a || null,
      skills: a ? db.askills.filter(s => s.assessment_id === a.id).sort((x, y) => x.position - y.position) : [],
      can_edit: (!a || a.status === 'draft') && e.status === 'active' && e.manager_code === myCode() && cyc?.status === 'open',
    };
  }

  return {
    demo: true,
    session: async () => me ? { user: { email: me } } : null,
    onAuth: cb => { listeners.push(cb); },
    demoSignIn: role => { me = role === 'admin' ? 'demo.admin@company.com' : 'sana.malik@company.com'; listeners.forEach(f => f({ user: { email: me } })); },
    signInMicrosoft: async () => {}, signInEmail: async () => {}, signInPassword: async () => {},
    changePassword: () => wait(null),
    managerLogins: (mode, emails) => {
      requireAdmin();
      const codes = new Set(db.employees.filter(e => e.status === 'active' && e.manager_code).map(e => e.manager_code));
      const pw = () => 'Demo' + Math.random().toString(36).slice(2, 8) + '#7';
      const res = db.employees.filter(e => codes.has(e.emp_code) && (!emails || emails.includes(e.email))).map(e => ({
        emp_code: e.emp_code, full_name: e.full_name, email: e.email,
        password: !e.email ? null : mode === 'reset' || !e.has_login ? pw() : null,
        status: !e.email ? 'No email in HR sheet — cannot create a login' : mode === 'reset' ? 'Password reset' : e.has_login ? 'Already has a login' : 'Created' }));
      res.forEach(r => { const e = byCode(r.emp_code); if (r.email) e.has_login = true; });
      return wait({ results: res });
    },
    signOut: async () => { me = null; listeners.forEach(f => f(null)); },

    context: () => {
      const code = myCode();
      return wait({ email: me, is_admin: isAdmin(), employee: code ? byCode(code) : null,
        report_count: db.employees.filter(e => e.manager_code === code && e.status === 'active').length,
        cycles: db.cycles.filter(c => c.status === 'open' || isAdmin()) });
    },
    catalog: () => wait({ skills: db.skills, levels: db.levels, reasons: db.reasons, cycles: db.cycles }),

    myTeam: cycleId => {
      const code = myCode();
      const rows = db.employees.filter(e => e.manager_code === code && e.status === 'active').map(e => {
        const a = db.assessments.find(x => x.cycle_id === cycleId && x.employee_code === e.emp_code);
        return { ...e, assessment_id: a?.id, assessment_status: !a ? 'not_started' : (a.manager_code !== code && a.status === 'submitted' ? 'submitted_by_other' : a.status),
          submitted_at: a?.submitted_at, is_current_report: true, note: null };
      });
      return wait(rows.sort((x, y) => x.full_name.localeCompare(y.full_name)));
    },
    getAssessment: (cycleId, code) => {
      const e = byCode(code); const a = db.assessments.find(x => x.cycle_id === cycleId && x.employee_code === code);
      if (!isAdmin() && !(a?.manager_code === myCode() || e?.manager_code === myCode())) return fail('Access denied: this employee is not in your team');
      return wait(getA(cycleId, code));
    },
    saveAssessment: p => {
      const cyc = db.cycles.find(c => c.id === p.cycle_id);
      const e = byCode(p.employee_code);
      if (!cyc || cyc.status !== 'open') return fail('This assessment cycle is not open');
      if (!e || e.manager_code !== myCode()) return fail('Access denied: this employee is not in your team');
      let a = db.assessments.find(x => x.cycle_id === p.cycle_id && x.employee_code === e.emp_code);
      if (a?.status === 'submitted') return fail('This assessment is already submitted. Ask an administrator to reopen it.');
      const errs = [];
      const skills = p.skills || [];
      if (skills.length > cyc.max_soft_skills) errs.push(`Select at most ${cyc.max_soft_skills} soft skills.`);
      for (const s of skills) {
        const sk = db.skills.find(x => x.id === s.skill_id);
        if (!sk) { errs.push('Choose a valid soft skill.'); continue; }
        if (p.submit && (s.current_level == null || s.target_level == null)) errs.push(`"${sk.name}": set both current and target proficiency.`);
        else if (s.current_level != null && s.target_level != null && +s.target_level <= +s.current_level) errs.push(`"${sk.name}": target proficiency must be higher than current.`);
      }
      if (p.submit) {
        if (!p.training_not_required && !skills.length) errs.push('Select at least one soft skill, or tick "No soft-skill training required".');
        if (!p.training_not_required && !p.reason_id) errs.push('Select why these skills are essential for the role.');
        if (!p.technical_skill_id && !p.technical_other && !p.technical_not_required) errs.push('Technical skill: choose a skill, "Other", or "Not required".');
      }
      if (errs.length) return fail(errs.join(' | '));
      if (!a) { a = { id: uid(), cycle_id: cyc.id, employee_code: e.emp_code, manager_code: myCode(), status: 'draft', reopen_count: 0, created_at: now() }; db.assessments.push(a); }
      Object.assign(a, { manager_code: myCode(), training_not_required: !!p.training_not_required, reason_id: p.reason_id || null,
        technical_skill_id: p.technical_skill_id || null, technical_other: p.technical_other || null,
        technical_not_required: !!p.technical_not_required, comments: p.comments || null, updated_at: now() });
      db.askills = db.askills.filter(s => s.assessment_id !== a.id);
      skills.forEach((s, i) => {
        const sk = db.skills.find(x => x.id === s.skill_id);
        const c = s.current_level == null ? null : +s.current_level, t = s.target_level == null ? null : +s.target_level;
        db.askills.push({ id: uid(), assessment_id: a.id, position: i + 1, skill_id: sk.id, skill_name: sk.name,
          current_level: c, target_level: t, skill_gap: c != null && t != null ? t - c : null, training_note: s.training_note || null });
      });
      if (p.submit) Object.assign(a, { status: 'submitted', submitted_at: now() }, snapshot(e, byCode(myCode())));
      return wait(getA(cyc.id, e.emp_code));
    },

    dashboard: cycleId => {
      requireAdmin();
      const req = db.employees.filter(e => e.status === 'active' && e.manager_code).map(e => ({ ...e,
        a_status: db.assessments.find(a => a.cycle_id === cycleId && a.employee_code === e.emp_code)?.status }));
      const group = (key) => Object.values(req.reduce((acc, r) => { (acc[r[key] ?? '(none)'] ??= []).push(r); return acc; }, {}));
      const by_manager = group('manager_code').map(rs => { const m = byCode(rs[0].manager_code);
        return { emp_code: m.emp_code, full_name: m.full_name, email: m.email, parent_department: m.parent_department,
          required: rs.length, completed: rs.filter(r => r.a_status === 'submitted').length, drafts: rs.filter(r => r.a_status === 'draft').length }; })
        .sort((a, b) => a.completed / a.required - b.completed / b.required);
      return wait({
        total_employees: db.employees.filter(e => e.status === 'active' && e.in_master).length,
        total_managers: by_manager.length,
        total_departments: new Set(db.employees.filter(e => e.status === 'active' && e.parent_department).map(e => e.parent_department)).size,
        required: req.length, completed: req.filter(r => r.a_status === 'submitted').length,
        drafts: req.filter(r => r.a_status === 'draft').length, pending: req.filter(r => r.a_status !== 'submitted').length,
        by_department: group('parent_department').map(rs => ({ department: rs[0].parent_department || '(none)', required: rs.length,
          completed: rs.filter(r => r.a_status === 'submitted').length })).sort((a, b) => a.department.localeCompare(b.department)),
        by_manager, last_import: db.batches.find(b => b.status === 'applied'),
      });
    },
    employees: () => { requireAdmin(); return wait([...db.employees].sort((a, b) => a.full_name.localeCompare(b.full_name))); },
    updateEmployee: (code, fields) => { requireAdmin(); const e = byCode(code); Object.assign(e, fields, { updated_at: now() }); log('update', 'employees', code, fields); return wait([e]); },
    addEmployee: row => { requireAdmin(); if (byCode(row.emp_code)) return fail('Employee ID already exists');
      const e = { status: 'active', in_master: true, created_at: now(), updated_at: now(), ...row }; db.employees.push(e); log('insert', 'employees', e.emp_code, row); return wait([e]); },
    reassignReports: (from, to) => { requireAdmin(); let n = 0; db.employees.forEach(e => { if (e.manager_code === from && e.status === 'active' && e.emp_code !== to) { e.manager_code = to; n++; } }); return wait(n); },

    importPreview: (fileName, rows) => {
      requireAdmin();
      const issues = [];
      const norm = rows.map(r => ({ ...r, emp_code: (r.emp_code || '').toUpperCase().replace(/\s+/g, '') || null,
        email: (r.email || '').toLowerCase().trim() || null, manager_code: (r.manager_code || '').toUpperCase().replace(/\s+/g, '') || null,
        manager_email: (r.manager_email || '').toLowerCase().trim() || null,
        status: /(inactive|left|resign|terminat|exit)/i.test(r.status || '') ? 'inactive' : 'active' }));
      const count = {}; norm.forEach(r => r.emp_code && (count[r.emp_code] = (count[r.emp_code] || 0) + 1));
      const bad = new Set();
      norm.forEach(r => {
        const add = (code, message, severity = 'error') => { issues.push({ row_no: r._row, emp_code: r.emp_code, severity, code, message }); if (severity === 'error') bad.add(r._row); };
        if (!r.emp_code) add('missing_id', 'Employee ID is blank');
        else if (count[r.emp_code] > 1) add('duplicate_id', `Employee ID ${r.emp_code} appears on ${count[r.emp_code]} rows`);
        if (!r.full_name) add('missing_name', 'Employee name is blank');
        if (r.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.email)) add('invalid_email', `Invalid email address "${r.email}"`);
        if (!r.email) add('missing_email', 'No email — this person cannot sign in (fine unless they are a line manager)', 'warning');
        if (!r.manager_code && r.manager_email) r.manager_code = norm.find(x => x.email === r.manager_email)?.emp_code || db.employees.find(x => x.email === r.manager_email)?.emp_code || null;
        if (!r.manager_code && (r.manager_name || r.manager_email)) add('manager_not_found', `Line manager "${r.manager_name || r.manager_email}" could not be matched — add the Manager Employee ID`);
        if (r.manager_code && r.manager_code === r.emp_code) add('self_manager', 'Employee is listed as their own line manager');
      });
      const valid = norm.filter(r => !bad.has(r._row));
      const codes = new Set(valid.map(r => r.emp_code));
      const lm = [...new Set(valid.map(r => r.manager_code).filter(c => c && !codes.has(c)))].map(c => {
        const src = valid.find(r => r.manager_code === c); return { emp_code: c, full_name: src.manager_name || c, email: src.manager_email, in_master: false };
      });
      const stage = [...valid.map(r => ({ ...r, in_master: true })), ...lm];
      const allCodes = new Set([...stage.map(s => s.emp_code), ...norm.map(r => r.emp_code)]);
      const leavers = db.employees.filter(e => e.status === 'active' && !allCodes.has(e.emp_code));
      const fields = ['full_name', 'email', 'job_title', 'parent_department', 'sub_department'];
      const summary = {
        file_name: fileName, total_rows: rows.length, valid_rows: valid.length, skipped_rows: rows.length - valid.length,
        new_employees: stage.filter(s => !byCode(s.emp_code)).map(s => ({ emp_code: s.emp_code, full_name: s.full_name, manager_code: s.manager_code, manager_only: !s.in_master })),
        updated_employees: valid.filter(s => byCode(s.emp_code)).map(s => { const e = byCode(s.emp_code); const changes = {};
          fields.forEach(f => { if ((e[f] ?? null) !== (s[f] ?? null)) changes[f] = { from: e[f], to: s[f] }; });
          return { emp_code: s.emp_code, full_name: s.full_name, changes }; }).filter(x => Object.keys(x.changes).length),
        manager_changes: valid.filter(s => byCode(s.emp_code) && byCode(s.emp_code).manager_code !== s.manager_code).map(s => ({
          emp_code: s.emp_code, full_name: s.full_name, from_code: byCode(s.emp_code).manager_code, from_name: byCode(byCode(s.emp_code).manager_code)?.full_name,
          to_code: s.manager_code, to_name: byCode(s.manager_code)?.full_name || stage.find(x => x.emp_code === s.manager_code)?.full_name, has_open_draft: false })),
        reactivated: valid.filter(s => byCode(s.emp_code)?.status === 'inactive' && s.status === 'active').map(s => ({ emp_code: s.emp_code, full_name: s.full_name })),
        marked_inactive_in_file: valid.filter(s => s.status === 'inactive' && byCode(s.emp_code)?.status !== 'inactive').map(s => ({ emp_code: s.emp_code, full_name: s.full_name })),
        leavers: leavers.map(e => ({ emp_code: e.emp_code, full_name: e.full_name, parent_department: e.parent_department })),
        new_managers: [], managers_dropped: [],
        total_managers_after: new Set(stage.filter(s => s.status === 'active' && s.manager_code).map(s => s.manager_code)).size,
        issues, error_count: issues.filter(i => i.severity === 'error').length, warning_count: issues.filter(i => i.severity === 'warning').length,
        mass_deactivation: leavers.length > Math.max(3, db.employees.filter(e => e.status === 'active').length * 0.15),
        active_before: db.employees.filter(e => e.status === 'active').length,
      };
      const before = new Set(db.employees.filter(e => e.status === 'active' && e.manager_code).map(e => e.manager_code));
      const after = new Set(stage.filter(s => s.status === 'active' && s.manager_code).map(s => s.manager_code));
      summary.new_managers = [...after].filter(c => !before.has(c)).map(c => ({ emp_code: c, full_name: stage.find(s => s.emp_code === c)?.full_name || c, reports: stage.filter(s => s.manager_code === c).length }));
      summary.managers_dropped = [...before].filter(c => !after.has(c)).map(c => ({ emp_code: c, full_name: byCode(c)?.full_name }));
      const b = { id: uid(), file_name: fileName, uploaded_by_email: me, uploaded_at: now(), status: 'previewed',
        total_rows: rows.length, valid_rows: valid.length, new_count: summary.new_employees.length, updated_count: summary.updated_employees.length,
        deactivated_count: leavers.length, manager_change_count: summary.manager_changes.length, error_count: summary.error_count,
        warning_count: summary.warning_count, summary, stage, leavers: leavers.map(e => e.emp_code) };
      db.batches.unshift(b);
      return wait({ ...summary, batch_id: b.id });
    },
    importCommit: (id, acceptSkipped, acceptMass) => {
      requireAdmin();
      const b = db.batches.find(x => x.id === id);
      if (!b || b.status !== 'previewed') return fail('This import was already processed');
      if (b.error_count && !acceptSkipped) return fail(`This file has ${b.error_count} rows with errors. Confirm that those rows should be skipped.`);
      if (b.summary.mass_deactivation && !acceptMass) return fail(`This import would mark ${b.deactivated_count} employees inactive. Confirm this is intended.`);
      for (const s of b.stage) {
        const e = byCode(s.emp_code);
        const row = { emp_code: s.emp_code, full_name: s.full_name, email: s.email, job_title: s.job_title ?? null,
          parent_department: s.parent_department ?? null, sub_department: s.sub_department ?? null,
          manager_code: s.manager_code ?? null, status: s.status || 'active', in_master: s.in_master };
        if (!e) db.employees.push({ ...row, created_at: now(), updated_at: now() });
        else if (s.in_master) Object.assign(e, row, { updated_at: now() });
        else Object.assign(e, { status: 'active', in_master: e.in_master });
      }
      b.leavers.forEach(c => { const e = byCode(c); if (e) e.status = 'inactive'; });
      b.status = 'applied'; b.applied_at = now();
      db.batches.forEach(x => { if (x.status === 'previewed') x.status = 'superseded'; });
      log('import', 'import_batches', id, { file_name: b.file_name, new: b.new_count, updated: b.updated_count, deactivated: b.deactivated_count });
      return wait({ status: 'applied', batch_id: id, deactivated: b.leavers.length });
    },
    importCancel: id => { const b = db.batches.find(x => x.id === id); if (b?.status === 'previewed') b.status = 'cancelled'; return wait(null); },
    importHistory: () => wait(db.batches.map(({ stage, leavers, summary, ...b }) => b)),
    importSummary: id => wait(db.batches.find(b => b.id === id)?.summary || {}),
    exportRows: (cycleId, includePending) => {
      requireAdmin();
      const out = [];
      for (const a of db.assessments.filter(x => !cycleId || x.cycle_id === cycleId)) {
        const e = byCode(a.employee_code), m = byCode(a.manager_code), c = db.cycles.find(x => x.id === a.cycle_id);
        const tech = a.technical_not_required ? 'Not Required' : a.technical_other ? 'Other: ' + a.technical_other : db.skills.find(s => s.id === a.technical_skill_id)?.name;
        const base = { assessment_cycle: c.name, submission_date: a.submitted_at, assessment_status: a.status, manager_code: a.manager_code,
          manager_name: a.snap_manager_name || m?.full_name, employee_code: a.employee_code, employee_name: a.snap_employee_name || e.full_name,
          parent_department: a.snap_parent_department || e.parent_department, sub_department: a.snap_sub_department || e.sub_department,
          job_title: a.snap_job_title || e.job_title, why_essential: db.reasons.find(r => r.id === a.reason_id)?.label, technical_skill: tech,
          manager_comments: a.comments, reopen_count: a.reopen_count, assessment_id: a.id };
        const sk = db.askills.filter(s => s.assessment_id === a.id);
        if (!sk.length) out.push({ ...base, soft_skill: a.training_not_required ? 'Not Required' : null });
        sk.forEach(s => out.push({ ...base, skill_no: s.position, soft_skill: s.skill_name,
          current_proficiency: db.levels.find(l => l.level === s.current_level)?.label, target_proficiency: db.levels.find(l => l.level === s.target_level)?.label,
          skill_gap: s.skill_gap, training_requirement: s.training_note }));
      }
      if (includePending && cycleId) {
        const c = db.cycles.find(x => x.id === cycleId);
        db.employees.filter(e => e.status === 'active' && e.manager_code && !db.assessments.some(a => a.cycle_id === cycleId && a.employee_code === e.emp_code))
          .forEach(e => out.push({ assessment_cycle: c.name, assessment_status: 'not_started', manager_code: e.manager_code, manager_name: byCode(e.manager_code)?.full_name,
            employee_code: e.emp_code, employee_name: e.full_name, parent_department: e.parent_department, sub_department: e.sub_department, job_title: e.job_title, reopen_count: 0 }));
      }
      return wait(out);
    },
    reopen: (id, note) => { requireAdmin(); const a = db.assessments.find(x => x.id === id); a.status = 'draft'; a.submitted_at = null; a.reopen_count++; log('reopen', 'assessments', id, { note }); return wait(null); },
    admins: () => wait(db.admins),
    addAdmin: email => { db.admins.push({ email: email.toLowerCase(), added_by: me, added_at: now() }); return wait(null); },
    removeAdmin: email => { if (db.admins.length <= 1) return fail('Cannot remove the last administrator'); db.admins = db.admins.filter(a => a.email !== email); return wait(null); },
    saveConfig: (table, row) => {
      const map = { skills: db.skills, reasons: db.reasons, cycles: db.cycles, proficiency_levels: db.levels };
      const list = map[table]; const key = table === 'proficiency_levels' ? 'level' : 'id';
      const clean = { ...row }; delete clean.__existing;
      const ex = row.__existing && list.find(x => x[key] === row[key]);
      if (ex) Object.assign(ex, clean); else list.push({ id: uid(), created_at: now(), ...clean });
      log(ex ? 'update' : 'insert', table, String(row[key] ?? ''), clean);
      return wait([clean]);
    },
    auditLog: () => wait(db.audit),
  };
}

// ---- js/api.js
// Data layer. Every call goes through Supabase with the signed-in user's
// token; the database decides what each user may see or change.

function friendly(error) {
  const msg = (error?.message || String(error)).replace(/^Please fix: /, '');
  const e = new Error(error?.code === '42501' && !/denied|required/i.test(msg)
    ? 'You do not have access to do that.' : msg);
  e.code = error?.code;
  return e;
}

function createApi(cfg) {
  if (!cfg.SUPABASE_URL) return createDemoApi(cfg);

  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' },
  });
  const unwrap = ({ data, error }) => { if (error) throw friendly(error); return data; };
  const rpc = (fn, args = {}) => sb.rpc(fn, args).then(unwrap);
  // PostgREST returns at most 1,000 rows per request on Supabase — page through larger results
  const all = async (make) => {
    const out = [];
    for (let from = 0; ; from += 1000) {
      const page = unwrap(await make().range(from, from + 999));
      out.push(...page);
      if (page.length < 1000) return out;
    }
  };
  const redirectTo = location.origin + location.pathname;

  return {
    demo: false,
    session: async () => (await sb.auth.getSession()).data.session,
    onAuth: cb => sb.auth.onAuthStateChange((_e, s) => cb(s)),
    signInMicrosoft: () => sb.auth.signInWithOAuth({ provider: 'azure', options: { scopes: 'email openid profile', redirectTo } }).then(unwrap),
    signInPassword: (email, password) => sb.auth.signInWithPassword({ email, password }).then(unwrap),
    signInEmail: email => sb.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectTo } }).then(unwrap),
    signOut: () => sb.auth.signOut(),
    changePassword: password => sb.auth.updateUser({ password }).then(unwrap),
    // Bulk logins run in a Supabase Edge Function (admin-only; service key stays server-side)
    managerLogins: async (mode, emails) => {
      const { data, error } = await sb.functions.invoke('create-manager-logins', { body: { mode, emails } });
      if (!error) return data;
      let msg = error.message;
      try { const b = await error.context.json(); msg = b.error || msg; } catch { /* not JSON */ }
      if (/Failed to send|not found|404|FunctionsFetchError/i.test(msg + error.name))
        msg = 'The "create-manager-logins" function is not set up in Supabase yet (see SETUP.md → Bulk logins).';
      throw new Error(msg);
    },

    context: () => rpc('my_context'),
    catalog: async () => {
      const [skills, levels, reasons, cycles] = await Promise.all([
        sb.from('skills').select('*').order('kind').order('sort_order').order('name').then(unwrap),
        sb.from('proficiency_levels').select('*').order('level').then(unwrap),
        sb.from('reasons').select('*').order('sort_order').then(unwrap),
        sb.from('cycles').select('*').order('created_at', { ascending: false }).then(unwrap),
      ]);
      return { skills, levels, reasons, cycles };
    },

    // manager
    myTeam: cycleId => rpc('my_team', { p_cycle_id: cycleId ?? null }),
    getAssessment: (cycleId, code) => rpc('get_assessment', { p_cycle_id: cycleId ?? null, p_emp_code: code }),
    saveAssessment: p => rpc('save_assessment', { p }),

    // admin
    dashboard: cycleId => rpc('admin_dashboard', { p_cycle_id: cycleId ?? null }),
    employees: () => all(() => sb.from('employees').select('*').order('full_name').order('emp_code')),
    updateEmployee: (code, fields) => sb.from('employees').update(fields).eq('emp_code', code).select().then(unwrap),
    addEmployee: row => sb.from('employees').insert(row).select().then(unwrap),
    reassignReports: (from, to) => rpc('admin_reassign_reports', { p_from: from, p_to: to }),
    importPreview: (fileName, rows) => rpc('import_preview', { p_file_name: fileName, p_rows: rows }),
    importCommit: (id, acceptSkipped, acceptMass) =>
      rpc('import_commit', { p_batch_id: id, p_accept_skipped: acceptSkipped, p_accept_mass_deactivation: acceptMass }),
    importCancel: id => rpc('import_cancel', { p_batch_id: id }),
    importHistory: () => sb.from('import_batches')
      .select('id,file_name,uploaded_by_email,uploaded_at,status,total_rows,valid_rows,new_count,updated_count,deactivated_count,manager_change_count,error_count,warning_count,applied_at')
      .order('uploaded_at', { ascending: false }).limit(50).then(unwrap),
    importSummary: id => sb.from('import_batches').select('summary').eq('id', id).single().then(unwrap).then(r => r.summary),
    exportRows: (cycleId, includePending) =>
      all(() => sb.rpc('admin_export', { p_cycle_id: cycleId || null, p_include_pending: !!includePending })),
    reopen: (id, note) => rpc('admin_reopen_assessment', { p_id: id, p_note: note }),
    admins: () => sb.from('admins').select('*').order('email').then(unwrap),
    addAdmin: email => rpc('admin_add_admin', { p_email: email }),
    removeAdmin: email => rpc('admin_remove_admin', { p_email: email }),
    saveConfig: (table, row) => {
      const key = table === 'proficiency_levels' ? 'level' : 'id';
      const exists = row.__existing;
      const clean = { ...row }; delete clean.__existing;
      return (exists ? sb.from(table).update(clean).eq(key, row[key]) : sb.from(table).insert(clean)).select().then(unwrap);
    },
    auditLog: () => sb.from('audit_log').select('*').order('at', { ascending: false }).limit(300).then(unwrap),
  };
}

// ------------------------------------------------------------------ helpers
class Raw { constructor(s) { this.s = s; } }
const raw = s => new Raw(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = v => v instanceof Raw ? v.s : Array.isArray(v) ? v.map(fmt).join('') : (v === null || v === undefined || v === false) ? '' : esc(v);
const html = (str, ...vals) => raw(str.reduce((a, s, i) => a + s + (i < vals.length ? fmt(vals[i]) : ''), ''));
const render = (el, tpl) => { el.innerHTML = tpl.s; };
const qs = (sel, root = document) => root.querySelector(sel);
const qsa = (sel, root = document) => [...root.querySelectorAll(sel)];
const fmtDate = d => d ? new Date(d).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const fmtDay = d => d ? new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
const pct = (a, b) => b ? Math.round((a / b) * 100) : 0;
const uniq = a => [...new Set(a.filter(Boolean))].sort((x, y) => String(x).localeCompare(String(y)));
const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function toast(msg, kind = 'ok') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  qs('#toast').appendChild(t);
  setTimeout(() => t.remove(), kind === 'err' ? 6000 : 3000);
}
const STATUS = {
  submitted: ['ok', 'Submitted'], draft: ['warn', 'Draft'], not_started: ['muted', 'Not started'],
  submitted_by_other: ['info', 'Done by previous manager'], active: ['ok', 'Active'], inactive: ['muted', 'Inactive'],
  open: ['ok', 'Open'], closed: ['muted', 'Closed'], applied: ['ok', 'Applied'], previewed: ['info', 'Previewed'],
  cancelled: ['muted', 'Cancelled'], superseded: ['muted', 'Superseded'], error: ['err', 'Error'], warning: ['warn', 'Warning'], info: ['info', 'Info'],
};
const chip = s => { const [k, l] = STATUS[s] || ['muted', s]; return html`<span class="chip ${k}">${l}</span>`; };

function modal({ title, body, foot, wide }) {
  const root = qs('#modal-root');
  render(root, html`<div class="modal-back"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${title}">
    <div class="modal-head"><h2>${title}</h2><button class="btn ghost sm" data-close aria-label="Close">✕</button></div>
    <div class="modal-body">${body}</div>${foot ? html`<div class="modal-foot">${foot}</div>` : ''}</div></div>`);
  const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  qs('[data-close]', root).onclick = close;
  qs('.modal-back', root).onclick = e => { if (e.target.classList.contains('modal-back')) close(); };
  return { root: qs('.modal', root), close };
}
function confirmBox(title, message, okLabel = 'Confirm', danger = false) {
  return new Promise(res => {
    const m = modal({ title, body: html`<p style="margin:0">${message}</p>`,
      foot: html`<button class="btn" data-no>Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-yes>${okLabel}</button>` });
    qs('[data-no]', m.root).onclick = () => { m.close(); res(false); };
    qs('[data-yes]', m.root).onclick = () => { m.close(); res(true); };
  });
}
async function busy(btn, fn) {
  const label = btn?.innerHTML; if (btn) { btn.disabled = true; btn.innerHTML = 'Working…'; }
  try { return await fn(); } finally { if (btn) { btn.disabled = false; btn.innerHTML = label; } }
}
function downloadXlsx(fileName, sheets /* [{name, rows:[{}], widths?}] */) {
  const wb = XLSX.utils.book_new();
  for (const s of sheets) {
    const ws = XLSX.utils.json_to_sheet(s.rows.length ? s.rows : [{ '(no rows)': '' }]);
    const cols = Object.keys(s.rows[0] || { x: 1 });
    ws['!cols'] = cols.map(c => ({ wch: Math.min(60, Math.max(c.length + 2, ...s.rows.slice(0, 200).map(r => String(r[c] ?? '').length + 1))) }));
    if (s.rows.length) ws['!autofilter'] = { ref: ws['!ref'] };
    XLSX.utils.book_append_sheet(wb, ws, s.name.slice(0, 31));
  }
  XLSX.writeFile(wb, fileName);
}

async function start() {
  if (!S.session) return renderLogin();

    [S.ctx, S.cat] = await Promise.all([api.context(), api.catalog()]);

  const open = S.cat.cycles.filter(c => c.status === 'open');

function route() {
  const [, a, b] = location.hash.replace(/^#\/?/, '#/').split('/');
  const fail = e => { console.error(e); const v = qs('#view'); if (v) render(v, html`<div class="banner err">${e.message}</div>`); else renderFatal(e.message); };
  if (a === 'team') return viewTeam().catch(fail);
  if (a === 'assess' && b) return viewAssessment(decodeURIComponent(b)).catch(fail);
  if (a === 'admin' && S.ctx.is_admin) {
    if (!S.cat.cycles.length && b !== 'settings' && b !== 'import' && b !== 'audit') {
      const v = shell(b || 'overview', 'Set-up needed', '');
      return render(v, html`<div class="card card-pad stack"><div class="banner warn"><div><b>No assessment cycle exists yet.</b> The starter data (seed.sql) has not been loaded.</div></div>
        <p style="margin:0">Either run <code>supabase/seed.sql</code> in the Supabase SQL Editor (recommended — it also loads the skills, reasons and rating scale), or create a cycle under <b>Settings → Assessment cycles</b>.</p>
        <div class="row"><button class="btn primary" onclick="location.hash='#/admin/settings'">Open Settings</button><button class="btn" onclick="location.reload()">I ran seed.sql — refresh</button></div></div>`);
    }
    const fn = { overview: adminOverview, employees: adminEmployees, managers: adminManagers, import: adminImport,
      assessments: adminAssessments, export: adminExport, settings: adminSettings, audit: adminAudit }[b] || adminOverview;
    return fn().catch(fail);
  }
  location.hash = S.ctx.report_count || !S.ctx.is_admin ? '#/team' : '#/admin/overview';
}

// ------------------------------------------------------------------ MANAGER: team
async function viewTeam() {
  const c = cycle();
  const v = shell('team', 'My Team', c ? `${c.name} · ${c.status === 'open' ? 'open for assessment' : c.status}` : 'No open assessment cycle');
  if (!c) return render(v, html`<div class="card empty">There is no open assessment cycle right now.</div>`);
  render(v, html`<div class="muted">Loading your team…</div>`);
  const rows = await api.myTeam(S.cycleId);
  const cur = rows.filter(r => r.is_current_report);
  const prev = rows.filter(r => !r.is_current_report);
  const n = s => cur.filter(r => r.assessment_status === s).length;
  const done = n('submitted') + n('submitted_by_other');
  render(v, html`
    <div class="stack">
      <div class="kpis">
        <div class="kpi"><div class="k-label">Team members</div><div class="k-value">${cur.length}</div></div>
        <div class="kpi"><div class="k-label">Submitted</div><div class="k-value">${done}</div></div>
        <div class="kpi"><div class="k-label">Drafts</div><div class="k-value">${n('draft')}</div></div>
        <div class="kpi"><div class="k-label">Not started</div><div class="k-value">${n('not_started')}</div></div>
        <div class="kpi accent"><div class="k-label">Completion</div><div class="k-value">${pct(done, cur.length)}%</div>
          <div class="bar lime" style="margin-top:8px;background:rgba(255,255,255,.15)"><span style="width:${pct(done, cur.length)}%"></span></div></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Direct reports</h2>
          <div class="row"><input type="search" id="q" placeholder="Search name, title, team…" style="width:240px">
          <select id="st" style="width:auto"><option value="">All statuses</option><option value="not_started">Not started</option><option value="draft">Draft</option><option value="submitted">Submitted</option></select></div></div>
        <div class="table-wrap"><table><thead><tr><th>Employee</th><th>Job title</th><th>Team</th><th>Status</th><th>Submitted</th><th></th></tr></thead>
          <tbody id="tb"></tbody></table></div>
      </div>
      ${prev.length ? html`<div class="card"><div class="card-head"><h2>Previously assessed</h2><span class="muted small">People you assessed this cycle who have since moved or left — read only</span></div>
        <div class="table-wrap"><table><tbody>${prev.map(r => html`<tr class="clickable" data-code="${r.emp_code}">
          <td><b>${r.full_name}</b><div class="sub">${r.emp_code}</div></td><td>${r.note}</td><td>${chip(r.assessment_status)}</td><td class="right"><button class="btn sm">View</button></td></tr>`)}</tbody></table></div></div>` : ''}
    </div>`);
  const tb = qs('#tb', v);
  const draw = () => {
    const q = qs('#q', v).value.toLowerCase(), st = qs('#st', v).value;
    const list = cur.filter(r => (!st || r.assessment_status === st || (st === 'submitted' && r.assessment_status === 'submitted_by_other'))
      && (!q || [r.full_name, r.emp_code, r.job_title, r.sub_department, r.parent_department].join(' ').toLowerCase().includes(q)));
    render(tb, list.length ? html`${list.map(r => html`<tr class="clickable" data-code="${r.emp_code}">
      <td><b>${r.full_name}</b><div class="sub">${r.emp_code}</div></td><td>${r.job_title}</td>
      <td>${r.sub_department || r.parent_department}</td><td>${chip(r.assessment_status)}</td><td class="nowrap">${fmtDay(r.submitted_at)}</td>
      <td class="right">${r.assessment_status === 'not_started' ? html`<button class="btn sm lime">Start</button>` : r.assessment_status === 'draft' ? html`<button class="btn sm primary">Continue</button>` : html`<button class="btn sm">View</button>`}</td></tr>`)}`
      : html`<tr><td colspan="6" class="empty">${cur.length ? 'No matches.' : 'No direct reports are assigned to you in the HR master data.'}</td></tr>`);
  };
  draw();
  qs('#q', v).oninput = debounce(draw, 120); qs('#st', v).onchange = draw;
  v.addEventListener('click', e => { const tr = e.target.closest('tr[data-code]'); if (tr) location.hash = '#/assess/' + encodeURIComponent(tr.dataset.code); });
}

// ------------------------------------------------------------------ MANAGER: assessment form
async function viewAssessment(code) {
  const v = shell('team', 'Assessment', '', html`<button class="btn" id="back">← Back to team</button>`);
  qs('#back').onclick = () => { location.hash = '#/team'; };
  render(v, html`<div class="muted">Loading…</div>`);
  const data = await api.getAssessment(S.cycleId, code);
  renderAssessmentForm(v, data, { onDone: () => { location.hash = '#/team'; } });
}

function renderAssessmentForm(v, data, { onDone, readOnlyNote } = {}) {
  const c = cycle();
  const a = data.assessment || {};
  const edit = !!data.can_edit;
  const soft = S.cat.skills.filter(s => s.kind === 'soft' && (s.active || data.skills.some(x => x.skill_id === s.id)));
  const tech = S.cat.skills.filter(s => s.kind === 'technical' && (s.active || s.id === a.technical_skill_id));
  const reasons = S.cat.reasons.filter(r => r.active || r.id === a.reason_id);
  const max = c?.max_soft_skills || 3;
  const state = {
    nr: !!a.training_not_required,
    skills: data.skills.length ? data.skills.map(s => ({ skill_id: s.skill_id, current_level: s.current_level, target_level: s.target_level, training_note: s.training_note || '' }))
                               : [{ skill_id: '', current_level: null, target_level: null, training_note: '' }],
  };
  const techVal = a.technical_not_required ? '__nr' : a.technical_other ? '__other' : (a.technical_skill_id || '');
  const e = data.employee;
  const dis = edit ? '' : 'disabled';

  render(v, html`<div class="stack" style="max-width:980px">
    <div class="card card-pad">
      <div class="row between" style="margin-bottom:14px"><h2>${e.full_name} <span class="muted" style="font-weight:500">· ${e.emp_code}</span></h2>${chip(a.status || 'not_started')}</div>
      <div class="emp-card">
        <div><div class="lbl">Job title</div><div class="val">${e.job_title || '—'}</div></div>
        <div><div class="lbl">Department</div><div class="val">${e.parent_department || '—'}</div></div>
        <div><div class="lbl">Sub-department</div><div class="val">${e.sub_department || '—'}</div></div>
        <div><div class="lbl">Line manager</div><div class="val">${e.manager_name || '—'}</div></div>
        <div><div class="lbl">Cycle</div><div class="val">${c?.name || ''}</div></div>
      </div>
    </div>
    ${a.status === 'submitted' ? html`<div class="banner ok">Submitted ${fmtDate(a.submitted_at)}. ${readOnlyNote || 'This record is locked — ask an administrator if it needs to be reopened.'}</div>`
      : !edit ? html`<div class="banner info">${readOnlyNote || 'Read only.'}</div>` : ''}
    ${a.reopen_count ? html`<div class="banner warn">Reopened by an administrator for correction (${a.reopen_count}×).</div>` : ''}
    <div id="err"></div>

    <div class="card card-pad">
      <div class="row between"><div><p class="section-title">Soft skills</p>
        <div class="muted small">Select up to ${max} soft skills that need training. Selecting one or two is fine.</div></div>
        <label class="check"><input type="checkbox" id="nr" ${state.nr ? 'checked' : ''} ${dis}> <span>No soft-skill training required</span></label></div>
      <div id="skills" style="margin-top:14px"></div>
      ${edit ? html`<button class="btn sm" id="add" style="margin-top:10px">+ Add soft skill</button>` : ''}
    </div>

    <div class="card card-pad form-grid">
      <label class="f"><span>Why are these skills essential for the role?</span>
        <select id="reason" ${dis}><option value="">Select…</option>${reasons.map(r => html`<option value="${r.id}" ${r.id === a.reason_id ? 'selected' : ''}>${r.label}</option>`)}</select></label>
      <label class="f"><span>Technical skill</span>
        <select id="tech" ${dis}><option value="">Select…</option>${tech.map(t => html`<option value="${t.id}" ${t.id === techVal ? 'selected' : ''}>${t.name}</option>`)}
          <option value="__other" ${techVal === '__other' ? 'selected' : ''}>Other (specify)</option><option value="__nr" ${techVal === '__nr' ? 'selected' : ''}>Not required</option></select></label>
      <label class="f ${techVal === '__other' ? '' : 'hidden'}" id="otherWrap"><span>Specify the tool or skill</span><input type="text" id="other" value="${a.technical_other || ''}" maxlength="120" ${dis}></label>
      <label class="f" style="grid-column:1/-1"><span>Manager comments <span class="muted">(optional)</span></span><textarea id="comments" maxlength="2000" ${dis}>${a.comments || ''}</textarea></label>
    </div>

    ${edit ? html`<div class="sticky-actions"><button class="btn" id="draft">Save draft</button><button class="btn primary" id="submit">Submit assessment</button></div>` : ''}
  </div>`);

  const box = qs('#skills', v);
  const levelsFor = (min) => S.cat.levels.filter(l => min == null || l.level > min);
  const drawSkills = () => {
    if (state.nr) { render(box, html`<div class="muted small">No soft-skill training needed for this employee.</div>`); qs('#add', v)?.classList.add('hidden'); return; }
    const chosen = state.skills.map(s => s.skill_id);
    render(box, html`${state.skills.map((s, i) => {
      const sk = soft.find(x => x.id === s.skill_id);
      const gap = s.current_level && s.target_level ? s.target_level - s.current_level : null;
      return html`<div class="skill-row" data-i="${i}">
        <div class="skill-head"><div><span class="skill-num">${i + 1}</span><b>${sk?.name || 'Choose a soft skill'}</b></div>
          ${edit && state.skills.length > 1 ? html`<button class="btn ghost sm" data-rm="${i}" aria-label="Remove skill ${i + 1}">Remove</button>` : ''}</div>
        <div class="skill-grid">
          <label class="f"><span>Soft skill</span><select data-f="skill_id" ${dis}><option value="">Select…</option>
            ${soft.map(o => html`<option value="${o.id}" ${o.id === s.skill_id ? 'selected' : ''} ${chosen.includes(o.id) && o.id !== s.skill_id ? 'disabled' : ''}>${o.name}</option>`)}</select></label>
          <label class="f"><span>Current proficiency</span><select data-f="current_level" ${dis}><option value="">Select…</option>
            ${S.cat.levels.filter(l => l.level < S.cat.levels.at(-1).level || l.level === s.current_level).map(l => html`<option value="${l.level}" ${l.level === s.current_level ? 'selected' : ''}>${l.label}</option>`)}</select></label>
          <label class="f"><span>Target (6–12 months)</span><select data-f="target_level" ${dis}><option value="">Select…</option>
            ${levelsFor(s.current_level).map(l => html`<option value="${l.level}" ${l.level === s.target_level ? 'selected' : ''}>${l.label}</option>`)}</select></label>
          <div><div class="small muted" style="margin-bottom:5px;font-weight:600">Gap</div><div class="gap-pill ${gap > 0 ? 'pos' : ''}">${gap == null ? '–' : '+' + gap}</div></div>
        </div>
        ${sk?.description ? html`<div class="hint">${sk.description}</div>` : ''}
        <label class="f" style="margin-top:10px"><span>Training requirement <span class="muted">(optional)</span></span>
          <input type="text" data-f="training_note" value="${s.training_note}" maxlength="300" placeholder="${edit ? 'e.g. Workshop, coaching, Moodle course…' : ''}" ${dis}></label>
      </div>`; })}`);
    const add = qs('#add', v); if (add) add.classList.toggle('hidden', state.skills.length >= max);
  };
  drawSkills();

  if (!edit) return;
  box.addEventListener('change', ev => {
    const row = ev.target.closest('[data-i]'); const f = ev.target.dataset.f; if (!row || !f) return;
    const s = state.skills[+row.dataset.i];
    s[f] = f === 'skill_id' || f === 'training_note' ? ev.target.value : (ev.target.value ? +ev.target.value : null);
    if (f === 'current_level' && s.target_level && s.current_level && s.target_level <= s.current_level) s.target_level = null;
    if (f !== 'training_note') drawSkills();
  });
  box.addEventListener('input', ev => { const row = ev.target.closest('[data-i]'); if (row && ev.target.dataset.f === 'training_note') state.skills[+row.dataset.i].training_note = ev.target.value; });
  box.addEventListener('click', ev => { const rm = ev.target.closest('[data-rm]'); if (rm) { state.skills.splice(+rm.dataset.rm, 1); drawSkills(); } });
  qs('#add', v).onclick = () => { if (state.skills.length < max) { state.skills.push({ skill_id: '', current_level: null, target_level: null, training_note: '' }); drawSkills(); } };
  qs('#nr', v).onchange = ev => { state.nr = ev.target.checked; if (!state.nr && !state.skills.length) state.skills.push({ skill_id: '', current_level: null, target_level: null, training_note: '' }); drawSkills(); };
  qs('#tech', v).onchange = ev => qs('#otherWrap', v).classList.toggle('hidden', ev.target.value !== '__other');

  const payload = submit => {
    const t = qs('#tech', v).value;
    return {
      cycle_id: S.cycleId, employee_code: e.emp_code, submit,
      training_not_required: state.nr,
      skills: state.nr ? [] : state.skills.filter(s => s.skill_id).map(s => ({ ...s })),
      reason_id: qs('#reason', v).value || null,
      technical_skill_id: t && !t.startsWith('__') ? t : null,
      technical_other: t === '__other' ? qs('#other', v).value.trim() || null : null,
      technical_not_required: t === '__nr',
      comments: qs('#comments', v).value,
    };
  };
  const save = async (submit, btn) => {
    const errBox = qs('#err', v); errBox.innerHTML = '';
    try {
      const res = await busy(btn, () => api.saveAssessment(payload(submit)));
      toast(submit ? 'Assessment submitted' : 'Draft saved');
      if (submit) onDone?.(); else renderAssessmentForm(v, res, { onDone });
    } catch (er) {
      render(errBox, html`<div class="banner err"><div><b>Not saved.</b><ul style="margin:6px 0 0;padding-left:18px">${er.message.split(' | ').map(m => html`<li>${m}</li>`)}</ul></div></div>`);
      errBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  };
  qs('#draft', v).onclick = ev => save(false, ev.currentTarget);
  qs('#submit', v).onclick = async ev => {
    const btn = ev.currentTarget;
    if (await confirmBox('Submit assessment?', `Once submitted, the assessment for ${e.full_name} is locked. An administrator can reopen it if a correction is needed.`, 'Submit')) save(true, btn);
  };
}

          <div class="row small"><span>${d.last_import.valid_rows} rows</span>·<span>${d.last_import.new_count} new</span>·<span>${d.last_import.updated_count} updated</span>·<span>${d.last_import.manager_change_count} manager changes</span>·<span>${d.last_import.deactivated_count} marked inactive</span></div></div>`

// ------------------------------------------------------------------ ADMIN: employees
async function loadEmployees(force) { if (force || !S.cache.emps) S.cache.emps = await api.employees(); return S.cache.emps; }

async function adminEmployees() {
  const v = shell('employees', 'Employees', 'HR master records. Manual edits are overwritten by the next master-sheet upload.',
    html`<button class="btn primary" id="addEmp">+ Add employee</button>`);
  render(v, html`<div class="muted">Loading…</div>`);
  const emps = await loadEmployees(true);
  const byCode = Object.fromEntries(emps.map(e => [e.emp_code, e]));
  render(v, html`<div class="card">
    <div class="card-head"><div class="row"><input type="search" id="q" placeholder="Search name, ID, email, title…" style="width:260px">
      <select id="dept" style="width:auto"><option value="">All departments</option>${uniq(emps.map(e => e.parent_department)).map(d => html`<option>${d}</option>`)}</select>
      <select id="st" style="width:auto"><option value="active">Active</option><option value="inactive">Inactive</option><option value="">All</option></select></div>
      <span class="muted small" id="cnt"></span></div>
    <div class="table-wrap" style="max-height:640px"><table><thead><tr><th>Employee</th><th>Job title</th><th>Department</th><th>Line manager</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div></div>`);
  const draw = () => {
    const q = qs('#q').value.toLowerCase(), dept = qs('#dept').value, st = qs('#st').value;
    const list = emps.filter(e => (!st || e.status === st) && (!dept || e.parent_department === dept)
      && (!q || [e.emp_code, e.full_name, e.email, e.job_title, e.sub_department].join(' ').toLowerCase().includes(q)));
    qs('#cnt').textContent = `${list.length} of ${emps.length}`;
    render(qs('#tb'), html`${list.slice(0, 500).map(e => html`<tr class="clickable" data-code="${e.emp_code}">
      <td><b>${e.full_name}</b> ${!e.in_master ? html`<span class="chip info" title="Appears only as a line manager in the master sheet">manager only</span>` : ''}<div class="sub">${e.emp_code} · ${e.email || html`<i>no email</i>`}</div></td>
      <td>${e.job_title}</td><td>${e.parent_department}<div class="sub">${e.sub_department}</div></td>
      <td>${byCode[e.manager_code]?.full_name || ''}<div class="sub">${e.manager_code}</div></td><td>${chip(e.status)}</td></tr>`)}
      ${list.length > 500 ? html`<tr><td colspan="5" class="empty">Showing first 500 — refine the search.</td></tr>` : ''}
      ${!list.length ? html`<tr><td colspan="5" class="empty">No employees match.</td></tr>` : ''}`);
  };
  draw();
  qs('#q').oninput = debounce(draw, 120); qs('#dept').onchange = draw; qs('#st').onchange = draw;
  qs('#tb').onclick = ev => { const tr = ev.target.closest('tr[data-code]'); if (tr) employeeModal(byCode[tr.dataset.code], emps); };
  qs('#addEmp').onclick = () => employeeModal(null, emps);
}

function employeeModal(e, emps) {
  const isNew = !e; e = e || { status: 'active' };
  const mgrs = emps.filter(x => x.status === 'active' && x.emp_code !== e.emp_code);
  const m = modal({ title: isNew ? 'Add employee' : `Edit ${e.full_name}`, wide: true,
    body: html`<div class="stack">
      ${!isNew ? html`<div class="banner info">The HR master sheet is the source of truth — the next upload will overwrite these fields for anyone listed in it.</div>` : ''}
      <div class="form-grid">
        <label class="f"><span>Employee ID</span><input type="text" id="f_code" value="${e.emp_code || ''}" ${isNew ? '' : 'disabled'}></label>
        <label class="f"><span>Full name</span><input type="text" id="f_name" value="${e.full_name || ''}"></label>
        <label class="f"><span>Email (used to sign in)</span><input type="email" id="f_email" value="${e.email || ''}"></label>
        <label class="f"><span>Job title</span><input type="text" id="f_title" value="${e.job_title || ''}"></label>
        <label class="f"><span>Department</span><input type="text" id="f_dept" list="dl_dept" value="${e.parent_department || ''}"></label>
        <label class="f"><span>Sub-department</span><input type="text" id="f_sub" list="dl_sub" value="${e.sub_department || ''}"></label>
        <label class="f"><span>Line manager</span><input type="text" id="f_mgr" list="dl_mgr" value="${e.manager_code || ''}" placeholder="Type a name or ID"></label>
        <label class="f"><span>Status</span><select id="f_status"><option value="active" ${e.status === 'active' ? 'selected' : ''}>Active</option><option value="inactive" ${e.status === 'inactive' ? 'selected' : ''}>Inactive</option></select></label>
      </div>
      <datalist id="dl_dept">${uniq(emps.map(x => x.parent_department)).map(d => html`<option value="${d}">`)}</datalist>
      <datalist id="dl_sub">${uniq(emps.map(x => x.sub_department)).map(d => html`<option value="${d}">`)}</datalist>
      <datalist id="dl_mgr">${mgrs.map(x => html`<option value="${x.emp_code}">${x.full_name}</option>`)}</datalist>
    </div>`,
    foot: html`<button class="btn" data-close2>Cancel</button><button class="btn primary" id="f_save">Save</button>` });
  qs('[data-close2]', m.root).onclick = m.close;
  qs('#f_save', m.root).onclick = async ev => {
    const val = id => qs(id, m.root).value.trim() || null;
    let mgr = val('#f_mgr');
    if (mgr && !emps.some(x => x.emp_code === mgr.toUpperCase())) {
      const hit = emps.find(x => x.full_name.toLowerCase() === mgr.toLowerCase()); mgr = hit?.emp_code || mgr;
    }
    const row = { full_name: val('#f_name'), email: val('#f_email')?.toLowerCase() || null, job_title: val('#f_title'),
      parent_department: val('#f_dept'), sub_department: val('#f_sub'), manager_code: mgr ? mgr.toUpperCase() : null, status: qs('#f_status', m.root).value };
    if (!row.full_name) return toast('Name is required', 'err');
    if (row.manager_code && !emps.some(x => x.emp_code === row.manager_code)) return toast('Line manager not found — pick from the list', 'err');
    try {
      await busy(ev.currentTarget, () => isNew ? api.addEmployee({ ...row, emp_code: (val('#f_code') || '').toUpperCase() }) : api.updateEmployee(e.emp_code, row));
      m.close(); toast('Saved'); adminEmployees();
    } catch (er) { toast(er.message, 'err'); }
  };
}

async function adminManagers() {
  const v = shell('managers', 'Managers', 'Managers are detected automatically from the HR master sheet — anyone with at least one active direct report.',
    CFG.AUTH?.password ? html`<button class="btn primary" id="mkLogins">Create logins for all managers</button>` : '');
  const mk = qs('#mkLogins'); if (mk) mk.onclick = () => loginsModal('create');
  render(v, html`<div class="muted">Loading…</div>`);
  const [emps, d] = await Promise.all([loadEmployees(true), api.dashboard(S.cycleId)]);
  const byCode = Object.fromEntries(emps.map(e => [e.emp_code, e]));
  const prog = Object.fromEntries(d.by_manager.map(m => [m.emp_code, m]));
  const teams = {};
  emps.filter(e => e.status === 'active' && e.manager_code).forEach(e => (teams[e.manager_code] ??= []).push(e));
  const mgrs = Object.keys(teams).map(c => ({ ...byCode[c], team: teams[c], p: prog[c] })).sort((a, b) => a.full_name.localeCompare(b.full_name));
  render(v, html`<div class="card"><div class="card-head"><input type="search" id="q" placeholder="Search manager…" style="width:240px"><span class="muted small">${mgrs.length} managers · ${mgrs.filter(m => !m.email).length} without a sign-in email</span></div>
    <div class="table-wrap" style="max-height:640px"><table><thead><tr><th>Manager</th><th>Department</th><th class="right">Direct reports</th><th>Completion</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>`);
  const draw = () => {
    const q = qs('#q').value.toLowerCase();
    render(qs('#tb'), html`${mgrs.filter(m => !q || (m.full_name + m.emp_code + (m.email || '')).toLowerCase().includes(q)).map(m => html`<tr>
      <td><b>${m.full_name}</b> ${m.status === 'inactive' ? chip('inactive') : ''}<div class="sub">${m.emp_code} · ${m.email || html`<span style="color:var(--err)">no email — cannot sign in</span>`}</div></td>
      <td>${m.parent_department || html`<span class="muted">—</span>`}</td><td class="right">${m.team.length}</td>
      <td>${m.p ? html`<div class="row" style="gap:8px;flex-wrap:nowrap"><div class="bar grow"><span style="width:${pct(m.p.completed, m.p.required)}%"></span></div><span class="small">${m.p.completed}/${m.p.required}</span></div>` : ''}</td>
      <td class="right nowrap"><button class="btn sm" data-team="${m.emp_code}">View team</button> <button class="btn sm" data-move="${m.emp_code}">Reassign reports</button>${CFG.AUTH?.password && m.email ? html` <button class="btn sm" data-reset="${m.email}" data-name="${m.full_name}">Reset password</button>` : ''}</td></tr>`)}`);
  };
  draw(); qs('#q').oninput = debounce(draw, 120);
  qs('#tb').onclick = async ev => {
    const t = ev.target.closest('[data-team]'), mv = ev.target.closest('[data-move]'), rs = ev.target.closest('[data-reset]');
    if (rs && await confirmBox('Reset password?', `A new password will be created for ${rs.dataset.name}. Their old password stops working immediately.`, 'Reset password', true))
      loginsModal('reset', [rs.dataset.reset]);
    if (t) { const m = mgrs.find(x => x.emp_code === t.dataset.team);
      modal({ title: `${m.full_name} — direct reports`, wide: true, body: html`<table><thead><tr><th>Employee</th><th>Job title</th><th>Team</th></tr></thead><tbody>
        ${m.team.map(e => html`<tr><td><b>${e.full_name}</b><div class="sub">${e.emp_code}</div></td><td>${e.job_title}</td><td>${e.sub_department}</td></tr>`)}</tbody></table>` }); }
    if (mv) {
      const from = mgrs.find(x => x.emp_code === mv.dataset.move);
      const mm = modal({ title: `Reassign ${from.team.length} reports from ${from.full_name}`,
        body: html`<div class="stack"><div class="banner warn">Use this when a manager leaves mid-cycle. The next HR master upload will apply whatever the sheet says.</div>
          <label class="f"><span>New line manager</span><input type="text" id="to" list="dl" placeholder="Employee ID"></label>
          <datalist id="dl">${emps.filter(e => e.status === 'active' && e.emp_code !== from.emp_code).map(e => html`<option value="${e.emp_code}">${e.full_name}</option>`)}</datalist></div>`,
        foot: html`<button class="btn primary" id="go">Reassign</button>` });
      qs('#go', mm.root).onclick = async ev2 => {
        const to = qs('#to', mm.root).value.trim().toUpperCase();
        try { const n = await busy(ev2.currentTarget, () => api.reassignReports(from.emp_code, to)); mm.close(); toast(`${n} reports moved`); adminManagers(); }
        catch (er) { toast(er.message, 'err'); }
      };
    }
  };
}

const siteUrl = () => location.origin + location.pathname;
function loginsModal(mode, emails) {
  const m = modal({ title: mode === 'reset' ? 'Reset password' : 'Create logins for all managers', wide: true,
    body: html`<div class="stack" id="lg">${mode === 'create' ? html`
      <p style="margin:0">This creates an email + password login for <b>every line manager in the HR master</b> who does not have one yet, each with a random password. Managers who already have a login are left unchanged.</p>
      <div class="banner info">Passwords are shown <b>only once</b>. Download the Excel file, send each manager their own row privately, then delete the file. Managers can change their password after signing in.</div>
      <div><button class="btn primary" id="lgGo">Create logins</button></div>` : html`<div class="muted">Creating a new password…</div>`}</div>` });
  const box = qs('#lg', m.root);
  const run = async (btn) => {
    try {
      const r = await busy(btn, () => api.managerLogins(mode, emails || null));
      const rows = r.results || [];
      const withPw = rows.filter(x => x.password);
      const count = s => rows.filter(x => x.status === s).length;
      const xlsx = () => downloadXlsx(`TNA manager logins - ${new Date().toISOString().slice(0, 10)}.xlsx`, [{ name: 'Logins',
        rows: withPw.map(x => ({ 'Manager': x.full_name, 'Employee ID': x.emp_code, 'Email (username)': x.email, 'Password': x.password, 'Website': siteUrl(), 'Status': x.status })) }]);
      const copyText = x => `Hi ${x.full_name.split(' ')[0]}, your TNA login:\nWebsite: ${siteUrl()}\nEmail: ${x.email}\nPassword: ${x.password}\nPlease change your password after signing in (link at the bottom left).`;
      render(box, html`<div class="stack">
        ${mode === 'create' ? html`<div class="kpis">
          <div class="kpi"><div class="k-label">Created now</div><div class="k-value">${count('Created')}</div></div>
          <div class="kpi"><div class="k-label">Already had a login</div><div class="k-value">${count('Already has a login')}</div></div>
          <div class="kpi"><div class="k-label">No email in HR sheet</div><div class="k-value">${rows.filter(x => !x.email).length}</div></div>
          <div class="kpi"><div class="k-label">Failed</div><div class="k-value">${rows.filter(x => x.status.startsWith('Failed')).length}</div></div></div>` : ''}
        ${withPw.length ? html`<div class="row"><button class="btn lime" id="lgXl">Download logins (Excel) ⇩</button><span class="muted small">Passwords are not stored anywhere else — download now.</span></div>` : html`<div class="banner ok">No new passwords were needed.</div>`}
        <div class="table-wrap" style="max-height:380px;border:1px solid var(--line);border-radius:8px"><table><thead><tr><th>Manager</th><th>Email</th><th>Password</th><th>Status</th><th></th></tr></thead><tbody>
          ${rows.map((x, i) => html`<tr><td><b>${x.full_name}</b><div class="sub">${x.emp_code}</div></td><td class="small">${x.email || '—'}</td>
            <td><code>${x.password || ''}</code></td><td class="small">${x.status}</td>
            <td class="right">${x.password ? html`<button class="btn sm" data-copy="${i}">Copy message</button>` : ''}</td></tr>`)}</tbody></table></div></div>`);
      const xl = qs('#lgXl', box); if (xl) xl.onclick = xlsx;
      box.onclick = async ev => { const c = ev.target.closest('[data-copy]'); if (!c) return;
        try { await navigator.clipboard.writeText(copyText(rows[+c.dataset.copy])); toast('Message copied — paste it into Teams or email'); }
        catch { toast('Copy failed — use the Excel download instead', 'err'); } };
    } catch (er) { render(box, html`<div class="banner err">${er.message}</div>`); }
  };
  if (mode === 'create') qs('#lgGo', box).onclick = ev => run(ev.currentTarget); else run(null);
}

      <td class="right">${b.total_rows}</td><td class="right">${b.new_count}</td><td class="right">${b.updated_count}</td><td class="right">${b.manager_change_count}</td>
