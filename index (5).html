function downloadImportSummary(s, name) {
  const f = r => r || [];
  downloadXlsx(`Import summary - ${String(name).replace(/\.[^.]+$/, '')}.xlsx`, [
    { name: 'Summary', rows: [
      ['File', s.file_name], ['Total rows', s.total_rows], ['Valid rows', s.valid_rows], ['Skipped rows (errors)', s.skipped_rows],
      ['New employees', f(s.new_employees).length], ['Updated employees', f(s.updated_employees).length],
      ['Manager changes', f(s.manager_changes).length], ['Marked inactive (left)', f(s.leavers).length],
      ['New managers', f(s.new_managers).length], ['Managers no longer managing', f(s.managers_dropped).length],
      ['Errors', s.error_count], ['Warnings', s.warning_count]].map(([k, val]) => ({ Item: k, Value: val })) },
    { name: 'New employees', rows: f(s.new_employees).map(x => ({ 'Employee ID': x.emp_code, Name: x.full_name, 'Manager ID': x.manager_code, 'Manager-only record': x.manager_only ? 'Yes' : '' })) },
    { name: 'Updated', rows: f(s.updated_employees).flatMap(x => Object.entries(x.changes).map(([k, c]) => ({ 'Employee ID': x.emp_code, Name: x.full_name, Field: k, From: c.from, To: c.to }))) },
    { name: 'Manager changes', rows: f(s.manager_changes).map(x => ({ 'Employee ID': x.emp_code, Name: x.full_name, 'From manager': x.from_name, 'From ID': x.from_code, 'To manager': x.to_name, 'To ID': x.to_code, 'Open draft': x.has_open_draft ? 'Yes' : '' })) },
    { name: 'Leavers', rows: f(s.leavers).map(x => ({ 'Employee ID': x.emp_code, Name: x.full_name, Department: x.parent_department })) },
    { name: 'Issues', rows: f(s.issues).map(i => ({ Row: i.row_no, 'Employee ID': i.emp_code, Severity: i.severity, Type: i.code, Message: i.message })) },
  ]);
}

async function handleFile(f) {
  const out = qs('#result');
  render(out, html`<div class="card card-pad muted">Reading ${f.name}…</div>`);
  let parsed, sheetName;
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { cellDates: false });
    const sheets = wb.SheetNames.map(n => ({ name: n, aoa: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: null, raw: false, blankrows: false }) }));
    const pick = pickSheet(sheets); sheetName = pick.name;
    parsed = rowsFromSheet(pick.aoa);
  } catch (e) { return render(out, html`<div class="banner err">Could not read the file: ${e.message}</div>`); }
  if (parsed.error || parsed.missing?.length) {
    return render(out, html`<div class="card card-pad stack"><div class="banner err"><div><b>The file is missing required columns:</b> ${(parsed.missing || []).join(', ') || parsed.error}</div></div>
      <div class="muted small">Sheet used: ${sheetName}. Expected headers such as “Employee ID” / “Emp. Code”, “Employee Name”, “LM Code” / “Manager Employee ID” or “Manager Email”. Download the template for the recommended format.</div></div>`);
  }
  render(out, html`<div class="card card-pad muted">Checking ${parsed.rows.length} rows against the database…</div>`);
  let s;
  try { s = await api.importPreview(f.name, parsed.rows); }
  catch (e) { return render(out, html`<div class="banner err">${e.message}</div>`); }
  renderPreview(out, s, parsed, sheetName);
}

function renderPreview(out, s, parsed, sheetName) {
  const infos = s.issues.filter(i => i.severity === 'info');
  const tiles = [
    ['total', 'Rows in file', s.total_rows], ['new', 'New employees', s.new_employees.length], ['upd', 'Updated', s.updated_employees.length],
    ['mgr', 'Manager changes', s.manager_changes.length], ['left', 'Will be marked inactive', s.leavers.length],
    ['react', 'Status changes', s.reactivated.length + s.marked_inactive_in_file.length],
    ['nm', 'New managers', s.new_managers.length], ['dm', 'No longer managing', s.managers_dropped.length],
    ['err', 'Errors (rows skipped)', s.error_count, 'err'], ['warn', 'Warnings', s.warning_count, 'warn'], ['info', 'Notes', infos.length],
  ];
  render(out, html`<div class="card"><div class="card-head"><div><h2>Import preview — ${s.file_name}</h2>
      <div class="muted small">Sheet “${sheetName}”, header on row ${parsed.headerRow} · ${s.valid_rows} valid rows · ${s.total_managers_after} line managers detected${parsed.ignored ? ` · ${parsed.ignored} non-employee rows ignored` : ''}</div></div>
      <button class="btn sm" id="dl">Download summary ⇩</button></div>
    <div class="card-pad stack">
      <details><summary class="small" style="cursor:pointer">Column mapping used</summary><div class="mapping" style="margin-top:8px">
        ${Object.entries(parsed.mapping).map(([k, col]) => html`<div><span class="muted">${FIELD_LABELS[k]}</span><b>${col}</b></div>`)}</div></details>
      ${s.mass_deactivation ? html`<div class="banner err"><div><b>Check this file.</b> It would mark ${s.leavers.length} of ${s.active_before} active employees as inactive. That usually means a partial or wrong sheet.</div></div>` : ''}
      ${s.error_count ? html`<div class="banner warn"><div><b>${s.skipped_rows} rows have errors and will be skipped.</b> Their existing records stay unchanged. Fix them in the sheet and re-upload, or import the valid rows now.</div></div>` : html`<div class="banner ok">No blocking errors found.</div>`}
      <div class="diff-grid">${tiles.map(([k, l, n, cls]) => html`<button class="diff-tile ${cls && n ? cls : ''}" data-k="${k}"><div class="n">${n}</div><div class="l">${l}</div></button>`)}</div>
      <div id="detail"></div>
      <div class="stack" style="border-top:1px solid var(--line);padding-top:16px">
        ${s.error_count ? html`<label class="check"><input type="checkbox" id="acc1"> <span>Skip the ${s.skipped_rows} rows with errors and import the rest</span></label>` : ''}
        ${s.mass_deactivation ? html`<label class="check"><input type="checkbox" id="acc2"> <span>I confirm ${s.leavers.length} employees have left and should be marked inactive</span></label>` : ''}
        <div class="row"><button class="btn primary" id="ok">Confirm and import</button><button class="btn" id="cancel">Cancel import</button>
          <span class="muted small">Assessments are never deleted. Leavers are marked inactive and their history is kept.</span></div>
      </div>
    </div></div>`);

  const detail = qs('#detail', out);
  const list = (rows, cols) => rows.length ? html`<div class="table-wrap" style="max-height:360px;border:1px solid var(--line);border-radius:8px"><table><thead><tr>${cols.map(c => html`<th>${c[0]}</th>`)}</tr></thead>
    <tbody>${rows.map(r => html`<tr>${cols.map(c => html`<td>${c[1](r)}</td>`)}</tr>`)}</tbody></table></div>` : html`<div class="muted small">Nothing in this group.</div>`;
  const show = k => {
    qsa('.diff-tile', out).forEach(t => t.classList.toggle('sel', t.dataset.k === k));
    const issues = sev => list(s.issues.filter(i => i.severity === sev), [['Row', i => i.row_no], ['Employee ID', i => i.emp_code], ['Issue', i => i.message]]);
    const views = {
      total: () => html`<div class="muted small">${s.valid_rows} of ${s.total_rows} rows are valid. Click a tile to see the details.</div>`,
      new: () => list(s.new_employees, [['ID', x => x.emp_code], ['Name', x => html`${x.full_name} ${x.manager_only ? html`<span class="chip info">manager only</span>` : ''}`], ['Reports to', x => x.manager_code]]),
      upd: () => list(s.updated_employees, [['ID', x => x.emp_code], ['Name', x => x.full_name], ['Changes', x => html`${Object.entries(x.changes).map(([f, c]) => html`<div class="small"><b>${f.replace('_', ' ')}</b>: ${c.from ?? '—'} → ${c.to ?? '—'}</div>`)}`]]),
      mgr: () => list(s.manager_changes, [['ID', x => x.emp_code], ['Name', x => x.full_name], ['From', x => x.from_name || x.from_code || '—'], ['To', x => x.to_name || x.to_code || '—'], ['', x => x.has_open_draft ? html`<span class="chip warn">open draft moves to new manager</span>` : '']]),
      left: () => list(s.leavers, [['ID', x => x.emp_code], ['Name', x => x.full_name], ['Department', x => x.parent_department]]),
      react: () => list([...s.reactivated, ...s.marked_inactive_in_file.map(x => ({ ...x, inactive: true }))], [['ID', x => x.emp_code], ['Name', x => x.full_name], ['Change', x => x.inactive ? 'Marked inactive in file' : 'Reactivated']]),
      nm: () => list(s.new_managers, [['ID', x => x.emp_code], ['Name', x => x.full_name], ['Direct reports', x => x.reports]]),
      dm: () => list(s.managers_dropped, [['ID', x => x.emp_code], ['Name', x => x.full_name]]),
      err: () => issues('error'), warn: () => issues('warning'), info: () => issues('info'),
    };
    render(detail, views[k]());
  };
  show(s.error_count ? 'err' : s.manager_changes.length ? 'mgr' : 'new');
  qs('.diff-grid', out).onclick = ev => { const t = ev.target.closest('[data-k]'); if (t) show(t.dataset.k); };
  qs('#dl', out).onclick = () => downloadImportSummary(s, s.file_name);
  qs('#cancel', out).onclick = async () => { await api.importCancel(s.batch_id); out.innerHTML = ''; toast('Import cancelled'); drawHistory(); };
  qs('#ok', out).onclick = async ev => {
    const a1 = qs('#acc1', out), a2 = qs('#acc2', out);
    if (a1 && !a1.checked) return toast('Tick the box to skip rows with errors, or fix the file first', 'err');
    if (a2 && !a2.checked) return toast('Confirm the mass deactivation, or cancel and check the file', 'err');
    try {
      const r = await busy(ev.currentTarget, () => api.importCommit(s.batch_id, !!a1?.checked, !!a2?.checked));
      S.cache = {};
      render(out, html`<div class="banner ok"><div><b>Import applied.</b> ${s.new_employees.length} new, ${s.updated_employees.length} updated, ${s.manager_changes.length} manager changes, ${r.deactivated} marked inactive. Manager dashboards are updated.</div></div>`);
      toast('HR master imported'); drawHistory();
    } catch (er) { toast(er.message, 'err'); }
  };
}

  const list = [...by.values()];
  render(v, html`<div class="card"><div class="card-head"><div class="row">

    qs('#cnt').textContent = `${f.length} of ${list.length}`;
    render(qs('#tb'), html`${f.slice(0, 600).map(r => html`<tr class="${r.assessment_status === 'not_started' ? '' : 'clickable'}" data-code="${r.employee_code}" data-st="${r.assessment_status}">

    const data = await api.getAssessment(S.cycleId, tr.dataset.code);
    data.can_edit = false;
    const m = modal({ title: 'Assessment', wide: true, body: html`<div id="ab"></div>`,
      foot: data.assessment?.status === 'submitted' ? html`<button class="btn danger" id="reopen">Reopen for correction</button>` : '' });
    renderAssessmentForm(qs('#ab', m.root), data, { readOnlyNote: data.assessment?.status === 'submitted' ? 'Administrator view.' : 'Draft — the line manager has not submitted yet.' });
    const rb = qs('#reopen', m.root);
    if (rb) rb.onclick = async () => {
      if (!await confirmBox('Reopen assessment?', 'The line manager will be able to edit and resubmit it. This is recorded in the audit log.', 'Reopen', true)) return;

const EXPORT_COLS = [

  ['Required Proficiency', r => r.target_proficiency], ['Skill Gap', r => r.skill_gap], ['Training Requirement', r => r.training_requirement],
  ['Why Essential', r => r.why_essential], ['Technical Skill', r => r.technical_skill], ['Manager Comments', r => r.manager_comments],
  ['Assessment Status', r => STATUS[r.assessment_status]?.[1] || r.assessment_status],
];
async function adminExport() {
  const v = shell('export', 'Export', 'Download TNA responses to Excel for analysis in Excel or Power BI. One row per employee per soft skill.');
  render(v, html`<div class="muted">Loading…</div>`);
  const load = async (cyc) => api.exportRows(cyc || null, !!cyc);
  let rows = await load(S.cycleId);
  render(v, html`<div class="stack"><div class="card card-pad"><div class="form-grid">
      <label class="f"><span>Assessment cycle</span><select id="x_cycle"><option value="">All cycles</option>${S.cat.cycles.map(c => html`<option value="${c.id}" ${c.id === S.cycleId ? 'selected' : ''}>${c.name}</option>`)}</select></label>
      <label class="f"><span>Department</span><select id="x_dept"></select></label>
      <label class="f"><span>Line manager</span><select id="x_mgr"></select></label>
      <label class="f"><span>Employee</span><input type="search" id="x_emp" placeholder="Name or ID"></label>
      <label class="f"><span>Competency</span><select id="x_skill"></select></label>
      <label class="f"><span>Status</span><select id="x_st"><option value="">Submitted + drafts</option><option value="submitted">Submitted only</option><option value="draft">Drafts only</option><option value="not_started">Not started (chase list)</option><option value="all">Everything</option></select></label>
    </div></div>
    <div class="card"><div class="card-head"><b id="x_cnt"></b><button class="btn lime" id="x_dl">Download Excel ⇩</button></div>
      <div class="table-wrap" style="max-height:480px"><table><thead><tr>${EXPORT_COLS.map(c => html`<th>${c[0]}</th>`)}</tr></thead><tbody id="x_tb"></tbody></table></div></div></div>`);
  const fillOpts = () => {
    const o = (id, vals, all) => { const el = qs(id); const cur = el.value; render(el, html`<option value="">${all}</option>${vals.map(x => html`<option value="${x[0]}" ${x[0] === cur ? 'selected' : ''}>${x[1]}</option>`)}`); };
    o('#x_dept', uniq(rows.map(r => r.parent_department)).map(d => [d, d]), 'All departments');
    const mg = new Map(rows.map(r => [r.manager_code, r.manager_name])); o('#x_mgr', [...mg].filter(x => x[0]).sort((a, b) => String(a[1]).localeCompare(String(b[1]))), 'All managers');
    o('#x_skill', uniq(rows.map(r => r.soft_skill)).map(s => [s, s]), 'All competencies');
  };
  const filtered = () => {
    const d = qs('#x_dept').value, m = qs('#x_mgr').value, e = qs('#x_emp').value.toLowerCase(), sk = qs('#x_skill').value, st = qs('#x_st').value;
    return rows.filter(r => (!d || r.parent_department === d) && (!m || r.manager_code === m) && (!sk || r.soft_skill === sk)
      && (!e || (r.employee_name + ' ' + r.employee_code).toLowerCase().includes(e))
      && (st === 'all' || (st ? r.assessment_status === st : r.assessment_status !== 'not_started')));
  };
  const draw = () => {
    const f = filtered();
    qs('#x_cnt').textContent = `${f.length} rows · ${new Set(f.map(r => r.employee_code)).size} employees`;
    render(qs('#x_tb'), f.length ? html`${f.slice(0, 100).map(r => html`<tr>${EXPORT_COLS.map(c => html`<td class="small">${c[1](r)}</td>`)}</tr>`)}
      ${f.length > 100 ? html`<tr><td colspan="${EXPORT_COLS.length}" class="muted small">Preview shows the first 100 rows — the download includes all ${f.length}.</td></tr>` : ''}`
      : html`<tr><td colspan="${EXPORT_COLS.length}" class="empty">No rows match these filters.</td></tr>`);
  };
  fillOpts(); draw();
  qsa('#x_dept,#x_mgr,#x_skill,#x_st').forEach(el => el.onchange = draw);
  qs('#x_emp').oninput = debounce(draw, 150);
  qs('#x_cycle').onchange = async ev => { rows = await load(ev.target.value); fillOpts(); draw(); };
  qs('#x_dl').onclick = () => {
    const f = filtered();
    const cyc = S.cat.cycles.find(c => c.id === qs('#x_cycle').value)?.name || 'All cycles';
    downloadXlsx(`TNA Export - ${cyc} - ${new Date().toISOString().slice(0, 10)}.xlsx`,
      [{ name: 'TNA Responses', rows: f.map(r => Object.fromEntries(EXPORT_COLS.map(([h, fn]) => [h, fn(r) ?? '']))) }]);
  };
}

        <b>Last sync ${fmtDate(last.finished_at || last.started_at)}</b> (${last.triggered_by === 'schedule' ? 'automatic' : last.triggered_by}) — ${last.matched} of ${last.employees} active employees found on Moodle, ${last.enrolments} enrolments.
        ${last.status !== 'ok' ? html` Status: <b>${last.status}</b>${last.detail ? ` — ${last.detail}` : ''}` : ''}
        ${last.unmatched_sample?.length ? html`<details style="margin-top:4px"><summary class="small" style="cursor:pointer">Employees not found on Moodle (by email)</summary><div class="small" style="margin-top:4px">${last.unmatched_sample.join(', ')}${last.employees - last.matched > last.unmatched_sample.length ? ' …' : ''}</div></details>` : ''}</div></div>`
      : html`<div class="card card-pad stack"><div class="banner info"><div><b>Connect Moodle to see course progress here.</b> A Moodle administrator switches on web services and creates a token (about 10 minutes), then you add two secrets in Supabase and deploy the <code>moodle-sync</code> function. See SETUP.md → “Moodle”. Then click <b>Test connection</b> and <b>Sync from Moodle now</b>.</div></div></div>`}
    <div class="card card-pad"><div class="row" style="gap:10px">
      <input type="search" id="lq" placeholder="Search employee…" style="width:200px" value="${L.filters.q}">
      <select id="ldept" style="width:auto"><option value="">All departments</option>${opts(data.map(r => r.dept))}</select>
      <select id="lmgr" style="width:auto"><option value="">All managers</option>${opts(data.map(r => r.manager))}</select>
      <select id="lcourse" style="width:auto;max-width:260px"><option value="">All courses</option>${opts(data.map(r => r.course_name))}</select>
      <select id="lstatus" style="width:auto"><option value="">Any status</option><option>Completed</option><option>In progress</option><option>Not started</option></select>
      <label class="check"><input type="checkbox" id="linc" ${L.filters.incomplete ? 'checked' : ''}> <span>Only people with unfinished courses</span></label>
      <button class="btn sm ghost" id="lclr">Clear</button>
    </div></div>
    <div class="kpis" id="lkpi"></div>
    <div class="card"><div class="card-head"><h2>Courses</h2><span class="muted small">click a course to filter</span></div><div class="table-wrap" style="max-height:360px" id="lcourses"></div></div>
    <div class="card">
      <div class="card-head" id="lbar" style="background:#fafbfb"></div>
      <div class="table-wrap" style="max-height:640px"><table><thead><tr><th style="width:36px"><input type="checkbox" id="lall" aria-label="Select all shown" style="accent-color:var(--brand)"></th>
        <th>Employee</th><th>Department</th><th>Line manager</th><th>Courses</th><th class="right">Done</th></tr></thead><tbody id="ltb"></tbody></table></div></div>
  </div>`);
  for (const [id, k] of [['#ldept', 'dept'], ['#lmgr', 'mgr'], ['#lcourse', 'course'], ['#lstatus', 'status']]) qs(id, v).value = L.filters[k];

  const filtered = () => {
    const f = L.filters, q = f.q.toLowerCase();
    let r = data.filter(x => (!f.dept || x.dept === f.dept) && (!f.mgr || x.manager === f.mgr) && (!f.course || x.course_name === f.course)
      && (!f.status || x.status === f.status) && (!q || (x.name + ' ' + x.emp_code + ' ' + (x.email || '')).toLowerCase().includes(q)));
    if (f.incomplete) { const inc = new Set(r.filter(x => !x.completed).map(x => x.emp_code)); r = r.filter(x => inc.has(x.emp_code)); }
    return r;
  };
  const people = rs => { const m = new Map(); for (const r of rs) { if (!m.has(r.emp_code)) m.set(r.emp_code, { code: r.emp_code, name: r.name, email: r.email, dept: r.dept, sub: r.sub, manager: r.manager, manager_email: r.manager_email, courses: [] }); m.get(r.emp_code).courses.push(r); } return [...m.values()].sort((a, b) => a.name.localeCompare(b.name)); };

  function draw() {
    const rs = filtered(), ppl = people(rs);
    const cnt = s2 => rs.filter(r => r.status === s2).length;
    const incPeople = ppl.filter(p => p.courses.some(c => !c.completed)).length;
    render(qs('#lkpi', v), html`
      <div class="kpi"><div class="k-label">People on Moodle</div><div class="k-value">${ppl.length}</div></div>
      <div class="kpi"><div class="k-label">Enrolments</div><div class="k-value">${rs.length}</div></div>
      <div class="kpi accent"><div class="k-label">Courses completed</div><div class="k-value">${pct(cnt('Completed'), rs.length)}%</div><div class="k-foot">${cnt('Completed')} of ${rs.length}</div></div>
      <div class="kpi"><div class="k-label">In progress</div><div class="k-value">${cnt('In progress')}</div></div>
      <div class="kpi"><div class="k-label">Not started</div><div class="k-value">${cnt('Not started')}</div></div>
      <div class="kpi"><div class="k-label">People with unfinished courses</div><div class="k-value">${incPeople}</div></div>`);
    const byCourse = [...new Set(rs.map(r => r.course_name))].map(c => { const l = rs.filter(r => r.course_name === c); const pr = l.filter(r => r.progress != null);
      return { c, n: l.length, done: l.filter(r => r.completed).length, prog: l.filter(r => r.status === 'In progress').length, ns: l.filter(r => r.status === 'Not started').length,
        avg: pr.length ? Math.round(pr.reduce((a, r) => a + +r.progress, 0) / pr.length) : null }; }).sort((a, b) => b.n - a.n);
    render(qs('#lcourses', v), byCourse.length ? html`<table><thead><tr><th>Course</th><th class="right">Enrolled</th><th class="right">Completed</th><th class="right">In progress</th><th class="right">Not started</th><th class="right">Avg progress</th><th style="width:22%">Completion</th></tr></thead><tbody>
      ${byCourse.map(x => html`<tr class="clickable" data-course="${x.c}"><td><b>${x.c}</b></td><td class="right">${x.n}</td><td class="right">${x.done}</td><td class="right">${x.prog}</td><td class="right">${x.ns}</td><td class="right">${x.avg == null ? '—' : x.avg + '%'}</td>
        <td><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="bar grow"><span style="width:${pct(x.done, x.n)}%"></span></div><b class="small">${pct(x.done, x.n)}%</b></div></td></tr>`)}</tbody></table>`
      : html`<div class="empty">No course data ${data.length ? 'matches these filters' : 'yet — connect Moodle and run a sync'}.</div>`);
    render(qs('#ltb', v), ppl.length ? html`${ppl.slice(0, 600).map(p => { const done = p.courses.filter(c => c.completed).length;
      return html`<tr><td>${p.email ? html`<input type="checkbox" data-sel="${p.code}" ${L.sel.has(p.code) ? 'checked' : ''} style="accent-color:var(--brand)" aria-label="Select ${p.name}">` : ''}</td>
        <td><b>${p.name}</b><div class="sub">${p.code}${p.email ? '' : ' · no email'}</div></td><td>${p.dept}<div class="sub">${p.sub}</div></td><td>${p.manager}</td>
        <td><div class="row" style="gap:6px">${p.courses.map(c => html`<span class="chip ${COURSE_CHIP[c.status]}" title="${c.status}${c.last_access ? ' · last opened ' + fmtDay(c.last_access) : ''}">${c.course_name}${c.progress != null && !c.completed ? ` · ${Math.round(c.progress)}%` : ''}</span>`)}</div></td>
        <td class="right nowrap"><b>${done}</b>/${p.courses.length}</td></tr>`; })}` : html`<tr><td colspan="6" class="empty">No one matches these filters.</td></tr>`);
    const shownCodes = ppl.filter(p => p.email).map(p => p.code);
    const all = qs('#lall', v); all.checked = shownCodes.length > 0 && shownCodes.every(c => L.sel.has(c)); all.indeterminate = !all.checked && shownCodes.some(c => L.sel.has(c));
    const n = L.sel.size, scope = n ? `${n} selected` : 'everyone shown with unfinished courses';
    render(qs('#lbar', v), html`<div class="row"><b>${n ? `${n} ${n === 1 ? 'person' : 'people'} selected` : `${ppl.length} people shown`}</b>${n ? html`<button class="btn sm ghost" id="lclrsel">Clear selection</button>` : html`<span class="muted small">— tick people to remind specific ones</span>`}</div>
      <div class="row"><button class="btn sm lime" id="lrem">Remind to complete (${scope})</button><button class="btn sm" id="lxl">Export Excel ⇩</button></div>`);
    const cs = qs('#lclrsel', v); if (cs) cs.onclick = () => { L.sel.clear(); draw(); };
    qs('#lrem', v).onclick = () => {
      const target = people(filtered()).filter(p => p.email && (!n || L.sel.has(p.code)) && p.courses.some(c => !c.completed));
      if (!target.length) return toast('Nobody in this selection has unfinished courses');
      courseRemindersModal(target, moodleUrl);
    };
    qs('#lxl', v).onclick = () => downloadXlsx(`Moodle course status - ${new Date().toISOString().slice(0, 10)}.xlsx`, [{ name: 'Course status',
      rows: rs.map(r => ({ 'Employee ID': r.emp_code, 'Employee': r.name, 'Email': r.email || '', 'Department': r.dept, 'Sub-department': r.sub, 'Line manager': r.manager,
        'Course': r.course_name, 'Status': r.status, 'Progress %': r.progress == null ? '' : Math.round(r.progress), 'Last opened': r.last_access ? fmtDay(r.last_access) : '' })) }]);
  }
  draw();
  const set = (k, val) => { L.filters[k] = val; draw(); };
  qs('#lq', v).oninput = debounce(e => set('q', e.target.value), 150);
  qs('#ldept', v).onchange = e => set('dept', e.target.value); qs('#lmgr', v).onchange = e => set('mgr', e.target.value);
  qs('#lcourse', v).onchange = e => set('course', e.target.value); qs('#lstatus', v).onchange = e => set('status', e.target.value);
  qs('#linc', v).onchange = e => set('incomplete', e.target.checked);
  qs('#lclr', v).onclick = () => { L.filters = { q: '', dept: '', mgr: '', course: '', status: '', incomplete: false }; L.sel.clear(); adminLearning(); };
  qs('#lcourses', v).onclick = e => { const tr = e.target.closest('[data-course]'); if (tr) { L.filters.course = tr.dataset.course; qs('#lcourse', v).value = tr.dataset.course; draw(); } };
  qs('#ltb', v).onchange = e => { const c = e.target.closest('[data-sel]'); if (!c) return; c.checked ? L.sel.add(c.dataset.sel) : L.sel.delete(c.dataset.sel); draw(); };
  qs('#lall', v).onchange = e => { people(filtered()).filter(p => p.email).forEach(p => e.target.checked ? L.sel.add(p.code) : L.sel.delete(p.code)); draw(); };
}

function courseRemindersModal(target, moodleUrl) {
  const link = moodleUrl ? `${moodleUrl}/my/courses.php` : '';
  const text = p => { const open = p.courses.filter(c => !c.completed);
    return `Hi ${p.name.split(' ')[0]},

This is a friendly reminder to complete your ${open.length === 1 ? 'course' : 'courses'} on Moodle:
${open.map(c => `- ${c.course_name}${c.progress != null ? ` (${Math.round(c.progress)}% complete)` : ''}`).join('\n')}

${link ? `Open your courses: ${link}` : 'Please log in to Moodle to continue.'}

Thank you`; };
  const subj = p => { const k = p.courses.filter(c => !c.completed).length; return `Reminder: ${k} Moodle course${k === 1 ? '' : 's'} to complete`; };
  const batches = []; for (let i = 0; i < target.length; i += 40) batches.push(target.slice(i, i + 40));
  const generic = `Hi all,

This is a friendly reminder to complete your assigned courses on Moodle.

${link ? `Open your courses: ${link}` : 'Please log in to Moodle to continue.'}

Thank you`;
  const status = {};
  const m = modal({ title: `Remind ${plural(target.length, 'person', 'people')} to complete courses`, wide: true, body: html`<div class="stack" id="cr"></div>` });
  const box = qs('#cr', m.root);
  const draw = () => {
    const cc = qs('#crcc', box)?.checked ?? false;
    render(box, html`<div class="stack">
      <label class="check"><input type="checkbox" id="crcc" ${cc ? 'checked' : ''}> <span>Copy each person's line manager (cc)</span></label>
      ${moodleUrl ? '' : html`<div class="banner info small">Tip: add your Moodle address in Settings → Email &amp; reminders so emails include a direct link to “My courses”.</div>`}
      <div class="card card-pad" style="background:#fafbfb"><b>Send from your own Outlook — no setup needed</b>
        <div class="row" style="margin-top:8px">${batches.map((bt, i) => html`<a class="btn sm primary" href="${mailto('', 'Reminder: please complete your Moodle courses', generic, bt.map(p => p.email).join(';'))}">${outlookIcon} One email to ${batches.length > 1 ? `group ${i + 1} (${bt.length})` : `all ${bt.length}`} (BCC)</a>`)}
          <span class="muted small">— or a personal email per person below, listing their unfinished courses.</span></div></div>
      ${resultTable(target, [['Employee', p => html`<b>${p.name}</b><div class="sub">${p.email}</div>`], ['Manager', p => p.manager],
        ['Unfinished', p => html`${p.courses.filter(c => !c.completed).map(c => c.course_name).join(', ')}`],
        ['', p => { const cce = cc && p.manager_email ? p.manager_email : '';
          const href = mailto(p.email, subj(p), text(p)) + (cce ? `&cc=${encodeURIComponent(cce)}` : '');
          return html`<a class="btn sm nowrap" href="${href}">${outlookIcon} Send via Outlook</a>`; }],
        ['Automatic', p => status[p.code] || '']])}
      <div class="row" style="border-top:1px solid var(--line);padding-top:12px"><button class="btn" id="crAuto">Send all automatically</button>
        <span class="muted small">Needs the automatic email connection (Settings → Email &amp; reminders).</span></div></div>`);
    qs('#crcc', box).onchange = draw;
  };
  draw();
  box.onclick = async e => {
    const b = e.target.closest('#crAuto'); if (!b) return;
    try {
      const r = await busy(b, () => api.moodle('remind', { emp_codes: target.map(p => p.code), cc_manager: qs('#crcc', box).checked }));
      r.results.forEach(x => { status[x.emp_code] = x.status; }); draw();
      toast(`${r.results.filter(x => x.status.startsWith('Sent')).length} course reminders sent automatically`);
    } catch (er) { toast(er.message + ' — you can still use the Outlook buttons.', 'err'); }
  };
}

// ------------------------------------------------------------------ ADMIN: built-in insights assistant
// Runs entirely in the browser on the data already loaded for Analytics.
// No external AI service, no API keys, nothing leaves the app.
const ASSIST = { history: [], tab: 'insights' };
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
const share = (a, b) => b ? Math.round(a / b * 100) : 0;

function tnaStats(rows) {
  const emps = new Map();                       // key → { status, dept, manager, employee, ... }
  for (const r of rows) if (!emps.has(r.key)) emps.set(r.key, r);
  const E = [...emps.values()];
  const by = (arr, f) => { const m = new Map(); for (const x of arr) { const k = f(x); if (k == null) continue; if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; };
  const sel = rows.filter(r => r.skill && r.skill !== 'Not Required');
  return {
    E, sel,
    total: E.length,
    submitted: E.filter(e => e.status === 'Submitted').length,
    drafts: E.filter(e => e.status === 'Draft').length,
    notStarted: E.filter(e => e.status === 'Not started').length,
    noNeed: new Set(rows.filter(r => r.skill === 'Not Required').map(r => r.key)).size,
    byDept: by(E, e => e.dept), byMgr: by(E, e => e.manager),
    bySkill: by(sel, r => r.skill), byTech: by(E.filter(e => e.tech && e.tech !== 'Not Required'), e => e.tech),
    byReason: by(E.filter(e => e.reason), e => e.reason),
  };
}
const statusCount = (list, s) => list.filter(e => e.status === s).length;

function buildInsights(rows, cycleObj) {
  const st = tnaStats(rows);
  const out = [];
  if (!st.total) return [{ kind: 'info', title: 'No data in this view', text: 'Clear some filters or upload the HR master and start assessments.' }];

  // 1. completion + pace
  const pctDone = share(st.submitted, st.total);
  out.push({ kind: pctDone >= 80 ? 'good' : pctDone >= 40 ? 'info' : 'warn', title: `Completion is ${pctDone}%`,
    text: `${st.submitted} of ${st.total} employees have a submitted assessment. ${st.drafts ? `${plural(st.drafts, 'draft')} ${st.drafts === 1 ? 'is' : 'are'} saved but not submitted — submitting ${st.drafts === 1 ? 'it' : 'them'} would lift completion to ${share(st.submitted + st.drafts, st.total)}%. ` : ''}${st.notStarted ? `${plural(st.notStarted, 'employee')} ${st.notStarted === 1 ? 'has' : 'have'} not been started.` : ''}`,
    filter: st.notStarted ? ['status', 'Not started'] : null });
  const dates = st.E.filter(e => e.status === 'Submitted' && e.date).map(e => new Date(e.date).getTime()).sort((a, b) => a - b);
  const pending = st.total - st.submitted;
  if (dates.length >= 2 && pending > 0) {
    const now = Date.now(), week = dates.filter(d => d > now - 7 * 864e5).length;
    const rate = week ? week / 7 : st.submitted / Math.max(1, (now - dates[0]) / 864e5);
    const daysNeeded = Math.ceil(pending / Math.max(rate, 0.01));
    const close = cycleObj?.closes_on ? new Date(cycleObj.closes_on + 'T23:59:59') : null;
    const daysLeft = close ? Math.ceil((close - now) / 864e5) : null;
    out.push({ kind: close && daysNeeded > daysLeft ? 'warn' : 'info', title: close ? (daysNeeded > daysLeft ? 'At risk of missing the deadline' : 'On track for the deadline') : 'Current pace',
      text: `Recent pace is about ${rate.toFixed(1)} submissions a day, so the remaining ${pending} would take roughly ${plural(daysNeeded, 'day')}.${close ? ` The cycle closes on ${fmtDay(cycleObj.closes_on)} (${daysLeft >= 0 ? plural(daysLeft, 'day') + ' left' : 'already passed'}). ${daysNeeded > daysLeft && daysLeft > 0 ? `To finish on time you need about ${(pending / Math.max(daysLeft, 1)).toFixed(1)} a day — send reminders now.` : ''}` : ''}` });
  }

  // 2. departments
  const depts = [...st.byDept.entries()].filter(([, l]) => l.length >= 3).map(([d, l]) => [d, share(statusCount(l, 'Submitted'), l.length), l.length]);
  if (depts.length >= 2) {
    depts.sort((a, b) => a[1] - b[1]);
    const [lo, hi] = [depts[0], depts.at(-1)];
    if (hi[1] - lo[1] >= 15) out.push({ kind: 'warn', title: `${lo[0]} is furthest behind`, text: `${lo[0]} is at ${lo[1]}% completion (${lo[2]} employees) versus ${hi[1]}% in ${hi[0]}.`, filter: ['dept', lo[0]] });
  }

  // 3. managers
  const mgrs = [...st.byMgr.entries()].map(([m, l]) => ({ m, n: l.length, pend: l.filter(e => e.status !== 'Submitted').length, done: statusCount(l, 'Submitted') }));
  const zero = mgrs.filter(x => x.done === 0 && x.n >= 2).sort((a, b) => b.n - a.n);
  const mostPending = [...mgrs].filter(x => x.pend).sort((a, b) => b.pend - a.pend).slice(0, 5);
  if (zero.length) out.push({ kind: 'warn', title: `${plural(zero.length, 'manager')} with nothing submitted`, text: `${zero.slice(0, 6).map(x => `${x.m} (${x.n})`).join(', ')}${zero.length > 6 ? ` and ${zero.length - 6} more` : ''}. These are the best targets for a personal follow-up.`, filter: ['manager', zero[0].m] });
  else if (mostPending.length) out.push({ kind: 'info', title: 'Most outstanding work', text: mostPending.map(x => `${x.m}: ${x.pend} pending`).join(' · '), filter: ['manager', mostPending[0].m] });

  // 4. skills
  if (st.sel.length) {
    const sk = [...st.bySkill.entries()].map(([s, l]) => ({ s, n: new Set(l.map(r => r.key)).size, l })).sort((a, b) => b.n - a.n);
    const top3 = sk.slice(0, 3);
    out.push({ kind: 'action', title: 'Top training needs', text: top3.map(x => `${x.s} — ${plural(x.n, 'employee')} (${share(x.l.length, st.sel.length)}% of all selections)`).join('; ') + '.', filter: ['skill', top3[0].s] });
    const conc = top3.map(x => { const d = [...new Map(x.l.map(r => [r.dept, 0])).keys()].map(dep => [dep, x.l.filter(r => r.dept === dep).length]).sort((a, b) => b[1] - a[1])[0]; return { ...x, dept: d[0], dn: d[1] }; })
      .filter(x => x.n >= 4 && x.dn / x.l.length >= 0.5);
    if (conc[0]) out.push({ kind: 'info', title: `${conc[0].s} need is concentrated`, text: `${share(conc[0].dn, conc[0].l.length)}% of ${conc[0].s} selections come from ${conc[0].dept} — a department-specific session would cover most of the need.`, filter: ['dept', conc[0].dept] });
    const gaps = sk.filter(x => x.l.filter(r => r.gap != null).length >= 3).map(x => { const g = x.l.filter(r => r.gap != null).map(r => r.gap); return { ...x, avg: g.reduce((a, b) => a + b, 0) / g.length }; }).sort((a, b) => b.avg - a.avg);
    const big = st.sel.filter(r => r.gap >= 2).length;
    if (gaps[0]) out.push({ kind: 'info', title: `Largest gap: ${gaps[0].s}`, text: `Average gap of ${gaps[0].avg.toFixed(1)} levels. ${big ? `${share(big, st.sel.filter(r => r.gap != null).length)}% of rated skills need a jump of 2+ levels (e.g. Beginner → Advanced) — plan these as multi-stage programmes rather than one-off sessions.` : ''}`, filter: ['skill', gaps[0].s] });
  }

  // 5. reasons
  const rs = [...st.byReason.entries()].map(([r, l]) => [r, l.length]).sort((a, b) => b[1] - a[1]);
  const rsTotal = rs.reduce((a, b) => a + b[1], 0);
  if (rs[0] && rsTotal >= 3) {
    const [r, n] = rs[0], p = share(n, rsTotal);
    const note = /future/i.test(r) ? 'The plan leans towards succession and growth — consider pairing training with stretch assignments.'
      : /performance/i.test(r) ? 'Needs are mainly corrective — link training to performance goals and check impact at the next review.'
      : /current/i.test(r) ? 'Needs are mainly about doing today\'s job well — prioritise short, practical sessions.' : '';
    out.push({ kind: 'info', title: `Main driver: ${r} (${p}%)`, text: note, filter: ['reason', r] });
  }

  // 6. technical + no-need
  const tk = [...st.byTech.entries()].map(([t, l]) => [t, l.length]).sort((a, b) => b[1] - a[1]).slice(0, 3);
  if (tk.length) out.push({ kind: 'info', title: 'Top technical requests', text: tk.map(([t, n]) => `${t} (${n})`).join(', ') + '.', filter: ['tech', tk[0][0]] });
  if (st.noNeed && st.submitted) out.push({ kind: share(st.noNeed, st.submitted) > 25 ? 'warn' : 'info', title: `${plural(st.noNeed, 'employee')} marked "no soft-skill training needed"`,
    text: `That is ${share(st.noNeed, st.submitted)}% of submitted assessments.${share(st.noNeed, st.submitted) > 25 ? ' Worth a sanity check with the managers involved.' : ''}`, filter: ['skill', 'Not Required'] });

  // 7. training plan
  const plan = trainingPlan(rows).slice(0, 3);
  if (plan.length) out.push({ kind: 'action', title: 'Suggested next step', text: `Run ${plan.map(p => `${p.skill} (${plural(p.batches, 'group')}, ${p.start} start)`).join(', ')} first — together they cover ${plural(new Set(plan.flatMap(p => p.keys)).size, 'employee')}.` });
  return out;
}

function trainingPlan(rows, batchSize = 15) {
  const sel = rows.filter(r => r.skill && r.skill !== 'Not Required');
  const m = new Map();
  for (const r of sel) { if (!m.has(r.skill)) m.set(r.skill, []); m.get(r.skill).push(r); }
  return [...m.entries()].map(([skill, l]) => {
    const keys = [...new Set(l.map(r => r.key))];
    const cur = {}; l.forEach(r => r.current && (cur[r.current] = (cur[r.current] || 0) + 1));
    const start = Object.entries(cur).sort((a, b) => b[1] - a[1])[0]?.[0] || '—';
    const depts = [...new Set(l.map(r => r.dept))];
    const g = l.filter(r => r.gap != null).map(r => r.gap);
    return { skill, n: keys.length, keys, batches: Math.ceil(keys.length / batchSize), start, depts, avgGap: g.length ? +(g.reduce((a, b) => a + b, 0) / g.length).toFixed(1) : null,
      future: l.filter(r => /future/i.test(r.reason || '')).length, perf: l.filter(r => /performance/i.test(r.reason || '')).length };
  }).sort((a, b) => b.n - a.n || (b.avgGap || 0) - (a.avgGap || 0));
}

// ---- question answering --------------------------------------------------
function findEntities(q, rows) {
  const text = ' ' + q.toLowerCase().replace(/[^a-z0-9&+ ]/g, ' ').replace(/\s+/g, ' ') + ' ';
  const found = [];
  const add = (dim, val, len) => found.push({ dim, val, len });
  for (const dim of ['dept', 'sub', 'manager', 'skill', 'tech', 'reason', 'title']) {
    const vals = [...new Set(rows.map(r => DIMS[dim][1](r)).filter(v => v && v !== '(none)' && v !== 'Not Required'))];
    for (const val of vals) {
      const v = ' ' + String(val).toLowerCase().replace(/[^a-z0-9&+ ]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
      if (v.trim().length < 2) continue;
      if (text.includes(v)) { add(dim, val, v.length + 100); continue; }
      const words = v.trim().split(' ').filter(w => w.length >= 4 && !['management', 'skills', 'training', 'department', 'executive', 'manager', 'senior'].includes(w));
      if (dim === 'manager') { const parts = v.trim().split(' '); if (parts.length >= 2 && text.includes(' ' + parts[0] + ' ') && text.includes(' ' + parts.at(-1) + ' ')) add(dim, val, v.length + 50); }
      else if (words.length && words.every(w => text.includes(' ' + w)) && ['skill', 'tech', 'dept', 'reason'].includes(dim)) add(dim, val, v.length);
    }
  }
  if (/not started|haven.?t started|not begun/.test(text)) add('status', 'Not started', 200);
  else if (/\bdrafts?\b/.test(text)) add('status', 'Draft', 200);
  else if (/\bsubmitted\b/.test(text) && !/not submitted/.test(text)) add('status', 'Submitted', 50);
  found.sort((a, b) => b.len - a.len);
  const out = []; const seen = new Set();
  for (const f of found) { const k = f.dim + '|' + f.val; if (!seen.has(k) && !out.some(o => o.dim === f.dim && String(o.val).toLowerCase().includes(String(f.val).toLowerCase()))) { seen.add(k); out.push(f); } }
  return out;
}

function answerQuestion(q, rows, cycleObj) {
  const ql = q.toLowerCase();
  const ents = findEntities(q, rows);
  const scopeEnts = ents.filter(e => ['dept', 'sub', 'manager', 'title', 'status', 'reason'].includes(e.dim));
  const pick = d => ents.filter(e => e.dim === d);
  const scope = scopeEnts.length ? rows.filter(r => scopeEnts.every(e => ents.filter(x => x.dim === e.dim).some(x => DIMS[x.dim][1](r) === x.val))) : rows;
  const lab = { dept: v => `in ${v}`, sub: v => `in ${v}`, manager: v => `in ${v}'s team`, title: v => `among ${v}s`, reason: v => `where the reason is ${v}`, status: v => `(${v.toLowerCase()})` };
  const scopeLabel = scopeEnts.length ? ' ' + scopeEnts.map(e => lab[e.dim](e.val)).join(' ') : '';
  const st = tnaStats(scope);
  const tbl = (cols, data) => ({ cols, rows: data });
  const filterAll = scopeEnts.map(e => [e.dim, e.val]);
  if (!rows.length) return { text: 'There is no data in the current view yet.' };

  // compare A vs B
  const depts = pick('dept'), mgrs = pick('manager');
  if (/compare|\bvs\b|versus|difference between/.test(ql) && (depts.length >= 2 || mgrs.length >= 2)) {
    const dim = depts.length >= 2 ? 'dept' : 'manager', items = (depts.length >= 2 ? depts : mgrs).slice(0, 4);
    const data = items.map(it => { const s = tnaStats(rows.filter(r => DIMS[dim][1](r) === it.val)); const top = [...s.bySkill.entries()].sort((a, b) => b[1].length - a[1].length)[0];
      const g = s.sel.filter(r => r.gap != null).map(r => r.gap);
      return [it.val, s.total, `${share(s.submitted, s.total)}%`, top ? top[0] : '—', g.length ? (g.reduce((a, b) => a + b, 0) / g.length).toFixed(1) : '—']; });
    return { text: `Side-by-side comparison of ${items.map(i => i.val).join(' and ')}:`, table: tbl(['', 'Employees', 'Completion', 'Top soft skill', 'Avg gap'], data), filters: items.map(i => [dim, i.val]) };
  }

  // who needs <skill>
  const skills = pick('skill'), techs = pick('tech');
  if (skills.length && /\bwho\b|which (employees|people|staff)|list|names?\b|employees need/.test(ql)) {
    const s = skills[0].val, list = scope.filter(r => r.skill === s);
    return { text: `${plural(new Set(list.map(r => r.key)).size, 'employee')}${scopeLabel} ${list.length === 1 ? 'needs' : 'need'} **${s}**:`,
      table: tbl(['Employee', 'Department', 'Manager', 'Current → Target'], list.slice(0, 60).map(r => [r.employee, r.dept, r.manager, `${r.current || '—'} → ${r.target || '—'}`])), filters: [...filterAll, ['skill', s]] };
  }
  if (techs.length && /\bwho\b|which|list|names?/.test(ql)) {
    const t = techs[0].val, list = [...new Map(scope.filter(r => r.tech === t).map(r => [r.key, r])).values()];
    return { text: `${plural(list.length, 'employee')}${scopeLabel} requested **${t}**:`, table: tbl(['Employee', 'Department', 'Manager'], list.slice(0, 60).map(r => [r.employee, r.dept, r.manager])), filters: [...filterAll, ['tech', t]] };
  }

  // training plan
  if (/plan|recommend|suggest|batch|cohort|workshop|session|what should we|priorit/.test(ql)) {
    const plan = trainingPlan(scope).slice(0, 8);
    if (!plan.length) return { text: `No skill needs have been recorded${scopeLabel} yet.` };
    return { text: `Suggested training plan${scopeLabel}, largest needs first (groups of up to 15). Start level = the most common current level, so the content pitch fits most attendees:`,
      table: tbl(['Programme', 'Employees', 'Groups', 'Start level', 'Avg gap', 'Departments'], plan.map(p => [p.skill, p.n, p.batches, p.start, p.avgGap ?? '—', p.depts.slice(0, 3).join(', ') + (p.depts.length > 3 ? ` +${p.depts.length - 3}` : '')])),
      after: plan[0].avgGap >= 1.5 ? `${plan[0].skill} has a large average gap, so plan it as a multi-session programme rather than a one-off workshop.` : null, filters: filterAll };
  }

  // counts by status ("how many have not started?")
  const statusEnt = pick('status')[0];
  if (statusEnt && /how many|count|number of|who|which|list/.test(ql) && !skills.length) {
    const baseEnts = scopeEnts.filter(e => e.dim !== 'status');
    const base = tnaStats(baseEnts.length ? rows.filter(r => baseEnts.every(e => baseEnts.filter(x => x.dim === e.dim).some(x => DIMS[x.dim][1](r) === x.val))) : rows);
    const n = base.E.filter(e => e.status === statusEnt.val).length;
    const byM = [...base.byMgr.entries()].map(([m, l]) => [m, l.filter(e => e.status === statusEnt.val).length, l.length]).filter(x => x[1]).sort((a, b) => b[1] - a[1]);
    return { text: `**${plural(n, 'employee')}**${scopeLabel.replace(` (${statusEnt.val.toLowerCase()})`, '')} ${n === 1 ? 'is' : 'are'} ${statusEnt.val.toLowerCase()} (${share(n, base.total)}% of ${base.total}), across ${plural(byM.length, 'manager')}:`,
      table: tbl(['Manager', statusEnt.val, 'Team size'], byM.slice(0, 25)), filters: filterAll };
  }

  // managers behind / pending
  if (/behind|lagging|slow|chase|pending|outstanding|not (yet )?(done|submitted|started)|who hasn.?t|haven.?t|reminder/.test(ql) && !skills.length) {
    const list = [...st.byMgr.entries()].map(([m, l]) => [m, l.length, l.filter(e => e.status !== 'Submitted').length, share(statusCount(l, 'Submitted'), l.length)]).filter(x => x[2] > 0).sort((a, b) => b[2] - a[2] || a[3] - b[3]);
    if (!list.length) return { text: `Everyone${scopeLabel} has submitted — nothing pending. 🎉` };
    return { text: `${plural(list.length, 'manager')}${scopeLabel} still ${list.length === 1 ? 'has' : 'have'} pending assessments (${st.total - st.submitted} employees in total). Most outstanding first:`,
      table: tbl(['Manager', 'Team', 'Pending', 'Completion'], list.slice(0, 25).map(x => [x[0], x[1], x[2], x[3] + '%'])),
      after: 'Tip: Managers → tick these people → Send reminder.', filters: [...filterAll, ...(scopeEnts.some(e => e.dim === 'status') ? [] : [['status', 'Not started']])] };
  }

  // gaps
  if (/\bgap|biggest|largest|furthest/.test(ql)) {
    const src = skills.length ? scope.filter(r => r.skill === skills[0].val) : scope;
    const plan = trainingPlan(src).filter(p => p.avgGap != null).sort((a, b) => b.avgGap - a.avgGap).slice(0, 10);
    if (!plan.length) return { text: `No rated skills${scopeLabel} yet.` };
    return { text: `Skill gaps${scopeLabel}${skills.length ? ` for ${skills[0].val}` : ''} (target level minus current level, averaged):`,
      table: tbl(['Soft skill', 'Avg gap', 'Employees', 'Most common start'], plan.map(p => [p.skill, p.avgGap, p.n, p.start])), filters: filterAll };
  }

  // technical
  if (/technical|tool|software|platform|\bit\b/.test(ql)) {
    const tk = [...st.byTech.entries()].map(([t, l]) => [t, l.length]).sort((a, b) => b[1] - a[1]).slice(0, 15);
    if (!tk.length) return { text: `No technical skills requested${scopeLabel} yet.` };
    return { text: `Technical skills requested${scopeLabel} (number of employees):`, table: tbl(['Technical skill', 'Employees'], tk), filters: filterAll };
  }

  // reasons
  if (/\bwhy\b|reason|driver|essential/.test(ql)) {
    const rs = [...st.byReason.entries()].map(([r, l]) => [r, l.length]).sort((a, b) => b[1] - a[1]);
    const tot = rs.reduce((a, b) => a + b[1], 0);
    return { text: `Why the skills are needed${scopeLabel}:`, table: tbl(['Reason', 'Employees', 'Share'], rs.map(([r, n]) => [r, n, share(n, tot) + '%'])), filters: filterAll };
  }

  // completion / progress
  if (/complet|progress|status|how far|how many|count|number of|done|submitted|overview|summar|highlight|insight|key finding|tell me about/.test(ql) && !skills.length) {
    if (/summar|overview|highlight|insight|key finding/.test(ql)) return { insights: buildInsights(scope, cycleObj), text: `Key findings${scopeLabel}:` };
    if (mgrs.length === 1 && scopeEnts.some(e => e.dim === 'manager')) {
      const team = st.E.sort((a, b) => a.status.localeCompare(b.status) || a.employee.localeCompare(b.employee));
      return { text: `${st.submitted} of ${st.total} employees${scopeLabel} are submitted (**${share(st.submitted, st.total)}%**), ${st.drafts} in draft, ${st.notStarted} not started:`,
        table: tbl(['Employee', 'Job title', 'Status'], team.map(e => [e.employee, e.title, e.status])), filters: filterAll };
    }
    const dim = scopeEnts.some(e => e.dim === 'dept') ? 'manager' : 'dept';
    const groups = [...(dim === 'dept' ? st.byDept : st.byMgr).entries()].map(([k, l]) => [k, l.length, statusCount(l, 'Submitted'), statusCount(l, 'Draft'), statusCount(l, 'Not started'), share(statusCount(l, 'Submitted'), l.length) + '%']).sort((a, b) => parseInt(a[5]) - parseInt(b[5]));
    return { text: `${st.submitted} of ${st.total} employees${scopeLabel} are submitted (**${share(st.submitted, st.total)}%**), ${st.drafts} in draft, ${st.notStarted} not started. By ${dim === 'dept' ? 'department' : 'manager'}:`,
      table: tbl([dim === 'dept' ? 'Department' : 'Manager', 'Employees', 'Submitted', 'Draft', 'Not started', 'Completion'], groups), filters: filterAll };
  }

  // top skills
  if (/top|most|common|popular|need|demand|main|key|frequent|skill/.test(ql) || skills.length || scopeEnts.length) {
    if (skills.length) {           // profile of one skill
      const s = skills[0].val, l = scope.filter(r => r.skill === s), p = trainingPlan(l)[0];
      if (!p) return { text: `Nobody${scopeLabel} has been assessed as needing ${s} yet.` };
      const byD = [...new Set(l.map(r => r.dept))].map(d => [d, new Set(l.filter(r => r.dept === d).map(r => r.key)).size]).sort((a, b) => b[1] - a[1]);
      return { text: `**${s}**${scopeLabel}: ${plural(p.n, 'employee')}, average gap ${p.avgGap ?? '—'}, most start at ${p.start}. ${p.future > p.perf ? 'Mostly flagged for future-role readiness.' : p.perf ? 'Often linked to performance improvement.' : ''} Where the need is:`,
        table: tbl(['Department', 'Employees'], byD), after: `Ask "who needs ${s}" for the names.`, filters: [...filterAll, ['skill', s]] };
    }
    const sk = [...st.bySkill.entries()].map(([s, l]) => [s, new Set(l.map(r => r.key)).size, l.length]).sort((a, b) => b[1] - a[1]).slice(0, 10);
    if (!sk.length) return { text: `No soft-skill needs recorded${scopeLabel} yet.` };
    return { text: `Most-needed soft skills${scopeLabel}:`, table: tbl(['Soft skill', 'Employees', 'Share of selections'], sk.map(([s, n, c]) => [s, n, share(c, st.sel.length) + '%'])), filters: filterAll };
  }

  return { text: 'I can answer questions about completion, managers who are behind, skill needs, who needs a skill, gaps, reasons, technical skills, comparisons and training plans. Try one of the suggestions below.' };
}

function mdLite(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }

function renderAssistant(box, ctx) {
  const rows = ctx.rows(), cyc = ctx.cycle();
  const top = trainingPlan(rows)[0]?.skill, depts = [...new Set(rows.map(r => r.dept))].filter(d => d !== '(none)');
  const sugg = ['Summarise the key findings', 'Which managers are behind?', top && `Who needs ${top}?`, depts[0] && `Top soft skills in ${depts[0]}`,
    'What are the biggest skill gaps?', 'Suggest a training plan', depts.length >= 2 && `Compare ${depts[0]} vs ${depts[1]}`, 'Top technical skills', 'Why are these skills needed?'].filter(Boolean);
  const kindStyle = { good: ['ok', '✓'], warn: ['warn', '!'], info: ['info', 'i'], action: ['ok', '→'] };
  const insightList = list => html`<div class="stack" style="gap:0">${list.map((x, i) => html`<div class="row" style="align-items:flex-start;flex-wrap:nowrap;padding:10px 0;${i ? 'border-top:1px dashed var(--line)' : ''}">
      <span class="chip ${kindStyle[x.kind][0]}" style="min-width:26px;justify-content:center">${kindStyle[x.kind][1]}</span>
      <div class="grow"><b>${x.title}</b>${x.text ? html`<div class="small" style="color:var(--ink-2);margin-top:2px">${x.text}</div>` : ''}</div>
      ${x.filter ? html`<button class="btn sm" data-f="${x.filter[0]}" data-v="${x.filter[1]}">Show</button>` : ''}</div>`)}</div>`;
  const answerHtml = a => html`<div class="small">${raw(mdLite(a.text || ''))}</div>
    ${a.insights ? insightList(a.insights) : ''}
    ${a.table ? html`<div class="table-wrap" style="margin-top:8px;max-height:300px;border:1px solid var(--line);border-radius:8px"><table><thead><tr>${a.table.cols.map(c => html`<th>${c}</th>`)}</tr></thead>
      <tbody>${a.table.rows.map(r => html`<tr>${r.map(c => html`<td class="small">${c}</td>`)}</tr>`)}</tbody></table></div>` : ''}
    ${a.after ? html`<div class="small muted" style="margin-top:6px">${a.after}</div>` : ''}
    ${a.filters?.length ? html`<div style="margin-top:8px"><button class="btn sm" data-fs="${JSON.stringify(a.filters)}">Apply as filter to the dashboard</button></div>` : ''}`;

  render(box, html`
    <div class="card-head"><div class="row"><h2>Insights assistant</h2><span class="chip muted" title="Runs in your browser on the data you can see — nothing is sent anywhere">built-in · private</span></div>
      <div class="tabs" style="margin:0;border:0">${[['insights', 'Key insights'], ['ask', 'Ask a question']].map(([k, l]) => html`<button data-at="${k}" class="${ASSIST.tab === k ? 'active' : ''}">${l}</button>`)}</div></div>
    <div class="card-pad">${ASSIST.tab === 'insights'
      ? html`<div class="muted small" style="margin-bottom:6px">Based on the current view${Object.keys(A.filters).length ? ' (filters applied)' : ''} · updates as you filter</div>${insightList(buildInsights(rows, cyc))}`
      : html`<div class="stack">
        <div id="as_thread" class="stack" style="max-height:520px;overflow:auto">${ASSIST.history.length ? ASSIST.history.map(h => html`
          <div style="align-self:flex-end;background:var(--brand);color:#fff;padding:8px 12px;border-radius:12px 12px 2px 12px;max-width:80%;margin-left:auto" class="small">${h.q}</div>
          <div style="background:#f7f9f8;border:1px solid var(--line);padding:10px 12px;border-radius:12px 12px 12px 2px">${answerHtml(h.a)}</div>`)
          : html`<div class="muted small">Ask about completion, managers who are behind, skill needs, gaps, reasons, comparisons or a training plan. Answers use the current view, including any filters.</div>`}</div>
        <form id="as_form" class="row" style="flex-wrap:nowrap"><input type="text" id="as_q" placeholder="e.g. Which managers in Client Fulfillment are behind?" autocomplete="off" class="grow">
          <button class="btn primary">Ask</button>${ASSIST.history.length ? html`<button type="button" class="btn ghost" id="as_clear">Clear</button>` : ''}</form>
        <div class="row" style="gap:6px">${sugg.map(s => html`<button class="btn sm" data-sug="${s}">${s}</button>`)}</div></div>`}
    </div>`);
  qsa('[data-at]', box).forEach(b => b.onclick = () => { ASSIST.tab = b.dataset.at; renderAssistant(box, ctx); if (ASSIST.tab === 'ask') qs('#as_q', box)?.focus(); });
  const ask = q => { if (!q.trim()) return; ASSIST.history.push({ q, a: answerQuestion(q, ctx.rows(), ctx.cycle()) }); if (ASSIST.history.length > 20) ASSIST.history.shift(); renderAssistant(box, ctx);
    const th = qs('#as_thread', box); if (th) th.scrollTop = th.scrollHeight; qs('#as_q', box)?.focus(); };
  const f = qs('#as_form', box); if (f) f.onsubmit = e => { e.preventDefault(); ask(qs('#as_q', box).value); };
  qsa('[data-sug]', box).forEach(b => b.onclick = () => { ASSIST.tab = 'ask'; ask(b.dataset.sug); });
  const c = qs('#as_clear', box); if (c) c.onclick = () => { ASSIST.history = []; renderAssistant(box, ctx); };
  box.onclick = e => {
    const one = e.target.closest('[data-f]'), many = e.target.closest('[data-fs]');
    if (one) ctx.setFilters([[one.dataset.f, one.dataset.v]]);
    if (many) ctx.setFilters(JSON.parse(many.dataset.fs));
  };
}

const PALETTE = ['#0F3031', '#7CC63A', '#2A7F86', '#E3A33B', '#5B8DB8', '#B3FA68', '#9C6ADE', '#D9534F', '#4BB3A6', '#8A9A5B', '#C77DBA', '#6C7A89'];
const STATUS_COLORS = { Submitted: '#1f8a4c', Draft: '#E3A33B', 'Not started': '#c9d2d1' };
const DIMS = {
  cycle: ['Cycle', r => r.cycle], dept: ['Department', r => r.dept], sub: ['Sub-department', r => r.sub],
  manager: ['Line manager', r => r.manager], title: ['Job title', r => r.title], status: ['Status', r => r.status],
  skill: ['Soft skill', r => r.skill], current: ['Current level', r => r.current], target: ['Target level', r => r.target],
  gap: ['Skill gap', r => r.gap == null ? null : '+' + r.gap], reason: ['Why essential', r => r.reason],
  tech: ['Technical skill', r => r.tech], month: ['Submission month', r => r.month],
};
const keysOf = rows => new Set(rows.map(r => r.key));
const MEASURES = {
  employees: ['Employees', rows => keysOf(rows).size],
  submitted: ['Submitted employees', rows => keysOf(rows.filter(r => r.status === 'Submitted')).size],
  completion: ['Completion %', rows => { const a = keysOf(rows).size; return a ? Math.round(keysOf(rows.filter(r => r.status === 'Submitted')).size / a * 100) : 0; }],
  selections: ['Skill selections', rows => rows.filter(r => r.skill && r.skill !== 'Not Required').length],
  avggap: ['Average skill gap', rows => { const g = rows.filter(r => r.gap != null).map(r => r.gap); return g.length ? +(g.reduce((a, b) => a + b, 0) / g.length).toFixed(2) : 0; }],
};
const normRow = x => ({
  key: x.assessment_cycle + '|' + x.employee_code, emp_code: x.employee_code, employee: x.employee_name,
  cycle: x.assessment_cycle, dept: x.parent_department || '(none)', sub: x.sub_department || '(none)',
  manager: x.manager_name || '(none)', title: x.job_title || '(none)',
  status: { submitted: 'Submitted', draft: 'Draft', not_started: 'Not started' }[x.assessment_status] || x.assessment_status,
  skill: x.soft_skill || null, current: x.current_proficiency || null, target: x.target_proficiency || null,
  gap: x.skill_gap ?? null, reason: x.why_essential || null, tech: x.technical_skill || null,
  month: x.submission_date ? String(x.submission_date).slice(0, 7) : null, date: x.submission_date || null, raw: x,
});
function groupBy(rows, dim) {
  const fn = DIMS[dim][1], m = new Map();
  for (const r of rows) { const k = fn(r); if (k == null) continue; if (!m.has(k)) m.set(k, []); m.get(k).push(r); }
  return m;
}

const A = { filters: {}, charts: [], cycle: undefined, rows: [], builder: { rows: 'dept', cols: '', measure: 'employees', type: 'bar', top: '15', sort: 'value' } };

async function adminAnalytics() {
  const v = shell('analytics', 'Analytics', 'Slice, filter and explore TNA results. Click any bar, slice or heatmap cell to filter every chart.');
  if (!window.Chart) return render(v, html`<div class="banner err">The chart library could not load. Check your internet connection and refresh.</div>`);
  if (A.cycle === undefined) A.cycle = S.cycleId || '';
  render(v, html`<div class="muted">Loading data…</div>`);

  A.rows = raw.map(normRow);

  C.defaults.font.family = 'Inter, system-ui, sans-serif'; C.defaults.font.size = 12; C.defaults.color = '#4a5859';
  C.defaults.plugins.legend.labels.boxWidth = 12;

  render(v, html`<div class="stack">
    <div class="card card-pad">
      <div class="row" style="gap:10px">
        <label class="f" style="min-width:170px"><span>Cycle</span><select id="an_cycle"><option value="">All cycles</option>${S.cat.cycles.map(c => html`<option value="${c.id}" ${c.id === A.cycle ? 'selected' : ''}>${c.name}</option>`)}</select></label>
        ${['dept', 'sub', 'manager', 'status', 'skill', 'reason', 'tech', 'title'].map(d => html`<label class="f" style="min-width:150px;flex:1"><span>${DIMS[d][0]}</span><select data-slicer="${d}"></select></label>`)}
      </div>
      <div class="row" id="an_chips" style="margin-top:12px"></div>
    </div>
    <div class="kpis" id="an_kpis"></div>
    <div class="card" id="an_ai"></div>
    <div class="grid-2">
      ${[['c_dept', 'Completion by department', 'dept'], ['c_skill', 'Most-needed soft skills', 'skill'], ['c_reason', 'Why these skills are essential', 'reason'],
         ['c_tech', 'Technical skills requested', 'tech'], ['c_levels', 'Current vs target proficiency', ''], ['c_gap', 'Average skill gap by soft skill', 'skill'],
         ['c_time', 'Submissions over time', ''], ['c_mgr', 'Line managers — completion % (lowest first)', 'manager']]
        .map(([id, t, d]) => html`<div class="card"><div class="card-head"><h2>${t}</h2>${d ? html`<span class="muted small">click to filter</span>` : ''}</div>
          <div class="card-pad"><div style="position:relative;height:${id === 'c_mgr' || id === 'c_dept' ? 340 : 280}px"><canvas id="${id}"></canvas></div></div></div>`)}
    </div>
    <div class="card"><div class="card-head"><h2>Heatmap — department × soft skill</h2><span class="muted small">number of skill selections · click a cell to filter</span></div><div class="table-wrap" id="an_heat"></div></div>
    <div class="card"><div class="card-head"><h2>Build your own analysis</h2><button class="btn sm" id="an_pdl">Download table ⇩</button></div>
      <div class="card-pad stack">
        <div class="form-grid">
          <label class="f"><span>Rows (group by)</span><select id="b_rows">${Object.entries(DIMS).map(([k, d]) => html`<option value="${k}">${d[0]}</option>`)}</select></label>
          <label class="f"><span>Columns (split by)</span><select id="b_cols"><option value="">— none —</option>${Object.entries(DIMS).map(([k, d]) => html`<option value="${k}">${d[0]}</option>`)}</select></label>
          <label class="f"><span>Measure</span><select id="b_measure">${Object.entries(MEASURES).map(([k, m]) => html`<option value="${k}">${m[0]}</option>`)}</select></label>
          <label class="f"><span>Chart</span><select id="b_type">${[['bar', 'Column'], ['hbar', 'Bar (horizontal)'], ['stacked', 'Stacked column'], ['hstacked', 'Stacked bar'], ['line', 'Line'], ['pie', 'Pie'], ['doughnut', 'Doughnut'], ['table', 'Table only']].map(([k, l]) => html`<option value="${k}">${l}</option>`)}</select></label>
          <label class="f"><span>Sort</span><select id="b_sort"><option value="value">Largest first</option><option value="label">A → Z</option></select></label>
          <label class="f"><span>Show</span><select id="b_top"><option value="10">Top 10</option><option value="15">Top 15</option><option value="25">Top 25</option><option value="all">All</option></select></label>
        </div>
        <div id="b_chartwrap" style="position:relative;height:360px"><canvas id="b_chart"></canvas></div>
        <div class="table-wrap" id="b_table" style="max-height:360px;border:1px solid var(--line);border-radius:8px"></div>
      </div></div>
    <div class="row"><button class="btn lime" id="an_xl">Download filtered data (Excel) ⇩</button><span class="muted small" id="an_count"></span></div>
  </div>`);

  // builder state → controls
  for (const k of ['rows', 'cols', 'measure', 'type', 'sort', 'top']) qs('#b_' + k, v).value = A.builder[k];

  const filtered = (except) => A.rows.filter(r => Object.entries(A.filters).every(([d, set]) => d === except || !set.size || set.has(DIMS[d][1](r))));
  const toggle = (d, val) => { if (val == null) return; (A.filters[d] ??= new Set()); A.filters[d].has(val) ? A.filters[d].delete(val) : A.filters[d].add(val); if (!A.filters[d].size) delete A.filters[d]; draw(); };

  const mk = (id, cfg, dim, labels) => {
    const el = qs('#' + id, v); if (!el) return;
    const o = cfg.options || {};
    cfg.options = { responsive: true, maintainAspectRatio: false, animation: false, ...o,
      plugins: { legend: { display: false }, ...(o.plugins || {}) } };
    if (dim) { cfg.options.onClick = (_e, els) => { if (els[0]) toggle(dim, labels[els[0].index]); };
      cfg.options.onHover = (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; }; }
    A.charts.push(new C(el, cfg));
  };
  const hl = (labels, dim, base) => labels.map((l, i) => !A.filters[dim]?.size || A.filters[dim].has(l) ? (Array.isArray(base) ? base[i % base.length] : base) : '#dfe5e4');
  const top = (map, n, measure = rows => rows.length) => [...map.entries()].map(([k, rs]) => [k, measure(rs)]).sort((a, b) => b[1] - a[1]).slice(0, n);

  function draw() {
    A.charts.forEach(c => c.destroy()); A.charts = [];
    const rows = filtered();
    // slicers
    for (const sel of qsa('[data-slicer]', v)) {
      const d = sel.dataset.slicer;
      const opts = [...groupBy(filtered(d), d).keys()].sort((a, b) => String(a).localeCompare(String(b)));
      render(sel, html`<option value="">${A.filters[d]?.size ? `${A.filters[d].size} selected — add…` : 'All'}</option>${opts.map(o => html`<option value="${o}">${A.filters[d]?.has(o) ? '✓ ' : ''}${o}</option>`)}`);
      sel.onchange = () => { if (sel.value) toggle(d, sel.value); };
    }
    const chips = Object.entries(A.filters).flatMap(([d, set]) => [...set].map(val => [d, val]));
    render(qs('#an_chips', v), chips.length ? html`${chips.map(([d, val]) => html`<button class="chip info" data-chip="${d}" data-val="${val}" style="border:0;cursor:pointer">${DIMS[d][0]}: ${val} ✕</button>`)}<button class="btn sm ghost" id="an_clear">Clear all filters</button>`
      : html`<span class="muted small">No filters — showing everything${A.cycle ? '' : ' across all cycles'}.</span>`);
    qsa('[data-chip]', v).forEach(b => b.onclick = () => toggle(b.dataset.chip, b.dataset.val));
    const clr = qs('#an_clear', v); if (clr) clr.onclick = () => { A.filters = {}; draw(); };

    // KPIs
    const emp = keysOf(rows).size, sub = MEASURES.submitted[1](rows), nr = keysOf(rows.filter(r => r.skill === 'Not Required')).size;
    render(qs('#an_kpis', v), html`
      <div class="kpi"><div class="k-label">Employees in view</div><div class="k-value">${emp}</div></div>
      <div class="kpi"><div class="k-label">Submitted</div><div class="k-value">${sub}</div></div>
      <div class="kpi accent"><div class="k-label">Completion</div><div class="k-value">${pct(sub, emp)}%</div></div>
      <div class="kpi"><div class="k-label">Skill selections</div><div class="k-value">${MEASURES.selections[1](rows)}</div></div>
      <div class="kpi"><div class="k-label">Average skill gap</div><div class="k-value">${MEASURES.avggap[1](rows) || '–'}</div><div class="k-foot">levels to grow</div></div>
      <div class="kpi"><div class="k-label">No soft-skill training needed</div><div class="k-value">${nr}</div></div>`);
    qs('#an_count', v).textContent = `${rows.length} rows · ${emp} employees in the current view`;

    // 1. completion by department (stacked)
    const depts = [...groupBy(rows, 'dept').entries()].sort((a, b) => keysOf(b[1]).size - keysOf(a[1]).size);
    const dl = depts.map(d => d[0]);
    mk('c_dept', { type: 'bar', data: { labels: dl, datasets: ['Submitted', 'Draft', 'Not started'].map(s => ({ label: s, backgroundColor: STATUS_COLORS[s],
        data: depts.map(([, rs]) => keysOf(rs.filter(r => r.status === s)).size) })) },
      options: { indexAxis: 'y', scales: { x: { stacked: true, grid: { color: '#eef1f0' } }, y: { stacked: true, grid: { display: false } } }, plugins: { legend: { display: true, position: 'bottom' } } } }, 'dept', dl);
    // 2. soft skills
    const sk = top(groupBy(rows.filter(r => r.skill !== 'Not Required'), 'skill'), 15);
    mk('c_skill', { type: 'bar', data: { labels: sk.map(x => x[0]), datasets: [{ label: 'Selections', data: sk.map(x => x[1]), backgroundColor: hl(sk.map(x => x[0]), 'skill', '#0F3031'), borderRadius: 4 }] },
      options: { indexAxis: 'y', scales: { x: { grid: { color: '#eef1f0' }, ticks: { precision: 0 } }, y: { grid: { display: false } } } } }, 'skill', sk.map(x => x[0]));
    // 3. reasons (per employee)
    const rs = top(groupBy(rows, 'reason'), 10, r => keysOf(r).size);
    mk('c_reason', { type: 'doughnut', data: { labels: rs.map(x => x[0]), datasets: [{ data: rs.map(x => x[1]), backgroundColor: hl(rs.map(x => x[0]), 'reason', PALETTE), borderWidth: 2 }] },
      options: { cutout: '58%', plugins: { legend: { display: true, position: 'right' } } } }, 'reason', rs.map(x => x[0]));
    // 4. technical skills (per employee)
    const tk = top(groupBy(rows.filter(r => r.tech !== 'Not Required'), 'tech'), 12, r => keysOf(r).size);
    mk('c_tech', { type: 'bar', data: { labels: tk.map(x => x[0]), datasets: [{ label: 'Employees', data: tk.map(x => x[1]), backgroundColor: hl(tk.map(x => x[0]), 'tech', '#2A7F86'), borderRadius: 4 }] },
      options: { indexAxis: 'y', scales: { x: { grid: { color: '#eef1f0' }, ticks: { precision: 0 } }, y: { grid: { display: false } } } } }, 'tech', tk.map(x => x[0]));
    // 5. current vs target
    const lv = S.cat.levels.map(l => l.label);
    mk('c_levels', { type: 'bar', data: { labels: lv, datasets: [
        { label: 'Current', data: lv.map(l => rows.filter(r => r.current === l).length), backgroundColor: '#c9d2d1', borderRadius: 4 },
        { label: 'Target', data: lv.map(l => rows.filter(r => r.target === l).length), backgroundColor: '#0F3031', borderRadius: 4 }] },
      options: { scales: { y: { grid: { color: '#eef1f0' }, ticks: { precision: 0 } }, x: { grid: { display: false } } }, plugins: { legend: { display: true, position: 'bottom' } } } });
    // 6. avg gap by skill
    const gp = top(groupBy(rows.filter(r => r.gap != null), 'skill'), 15, MEASURES.avggap[1]);
    mk('c_gap', { type: 'bar', data: { labels: gp.map(x => x[0]), datasets: [{ label: 'Average gap', data: gp.map(x => x[1]), backgroundColor: hl(gp.map(x => x[0]), 'skill', '#7CC63A'), borderRadius: 4 }] },
      options: { indexAxis: 'y', scales: { x: { beginAtZero: true, grid: { color: '#eef1f0' } }, y: { grid: { display: false } } } } }, 'skill', gp.map(x => x[0]));
    // 7. submissions over time (cumulative, per employee)
    const firstByEmp = new Map();
    rows.filter(r => r.status === 'Submitted' && r.date).forEach(r => { const d = String(r.date).slice(0, 10); if (!firstByEmp.has(r.key) || d < firstByEmp.get(r.key)) firstByEmp.set(r.key, d); });
    const days = [...new Set(firstByEmp.values())].sort();
    let run = 0; const cum = days.map(d => (run += [...firstByEmp.values()].filter(x => x === d).length));
    mk('c_time', { type: 'line', data: { labels: days.map(d => fmtDay(d)), datasets: [{ label: 'Submitted (cumulative)', data: cum, borderColor: '#0F3031', backgroundColor: 'rgba(124,198,58,.25)', fill: true, tension: .25, pointRadius: 3 }] },
      options: { scales: { y: { beginAtZero: true, grid: { color: '#eef1f0' }, ticks: { precision: 0 } }, x: { grid: { display: false } } } } });
    // 8. manager completion
    const mg = [...groupBy(rows, 'manager').entries()].map(([k, r]) => [k, MEASURES.completion[1](r), keysOf(r).size]).sort((a, b) => a[1] - b[1] || b[2] - a[2]).slice(0, 15);
    mk('c_mgr', { type: 'bar', data: { labels: mg.map(x => x[0]), datasets: [{ label: 'Completion %', data: mg.map(x => x[1]),
        backgroundColor: hl(mg.map(x => x[0]), 'manager', mg.map(x => x[1] >= 80 ? '#1f8a4c' : x[1] >= 40 ? '#E3A33B' : '#D9534F')), borderRadius: 4 }] },
      options: { indexAxis: 'y', scales: { x: { min: 0, max: 100, grid: { color: '#eef1f0' }, ticks: { callback: v2 => v2 + '%' } }, y: { grid: { display: false } } },
        plugins: { tooltip: { callbacks: { label: c => `${c.raw}% of ${mg[c.dataIndex][2]} employees` } } } } }, 'manager', mg.map(x => x[0]));

    // heatmap
    const sel = rows.filter(r => r.skill && r.skill !== 'Not Required');
    const hs = top(groupBy(sel, 'skill'), 10).map(x => x[0]);
    const hd = [...groupBy(sel, 'dept').keys()].sort();
    const cell = (d, s) => sel.filter(r => r.dept === d && r.skill === s).length;
    const max = Math.max(1, ...hd.flatMap(d => hs.map(s => cell(d, s))));
    render(qs('#an_heat', v), hs.length ? html`<table><thead><tr><th>Department</th>${hs.map(s => html`<th class="small" style="white-space:normal;min-width:84px">${s}</th>`)}<th class="right">Total</th></tr></thead><tbody>
      ${hd.map(d => html`<tr><td><b>${d}</b></td>${hs.map(s => { const n = cell(d, s), a = n / max;
        return html`<td data-hd="${d}" data-hs="${s}" style="text-align:center;cursor:${n ? 'pointer' : 'default'};background:rgba(15,48,49,${n ? (0.08 + a * 0.85).toFixed(2) : 0});color:${a > 0.5 ? '#fff' : 'inherit'};font-weight:${n ? 600 : 400}">${n || ''}</td>`; })}
        <td class="right"><b>${sel.filter(r => r.dept === d).length}</b></td></tr>`)}</tbody></table>` : html`<div class="empty">No skill selections in this view yet.</div>`);
    qsa('[data-hd]', v).forEach(td => td.onclick = () => { if (!td.textContent.trim()) return; A.filters.dept = new Set([td.dataset.hd]); A.filters.skill = new Set([td.dataset.hs]); draw(); });

    drawBuilder(rows);
    renderAssistant(qs('#an_ai', v), {
      rows: () => filtered(),
      cycle: () => S.cat.cycles.find(c => c.id === A.cycle),
      setFilters: list => { const g = {}; list.forEach(([d, val]) => (g[d] ??= new Set()).add(val)); Object.assign(A.filters, g); draw(); qs('#an_kpis', v).scrollIntoView({ behavior: 'smooth', block: 'start' }); },
    });
  }

  let pivot = null;
  function drawBuilder(rows) {
    const b = A.builder; const [mName, mFn] = MEASURES[b.measure];
    const groups = [...groupBy(rows, b.rows).entries()].map(([k, rs]) => ({ k, rs, val: mFn(rs) }));
    groups.sort(b.sort === 'label' ? (x, y) => String(x.k).localeCompare(String(y.k), undefined, { numeric: true }) : (x, y) => y.val - x.val);
    const shown = b.top === 'all' ? groups : groups.slice(0, +b.top);
    const colKeys = b.cols ? [...groupBy(rows, b.cols).keys()].sort((x, y) => String(x).localeCompare(String(y), undefined, { numeric: true })) : [];
    const colFn = b.cols ? DIMS[b.cols][1] : null;
    pivot = { rowName: DIMS[b.rows][0], colKeys, mName, data: shown.map(g => ({ k: g.k, total: g.val, cols: colKeys.map(c => mFn(g.rs.filter(r => colFn(r) === c))) })) };

    qs('#b_chartwrap', v).classList.toggle('hidden', b.type === 'table');
    if (b.type !== 'table') {
      const labels = pivot.data.map(d => d.k);
      const stacked = b.type === 'stacked' || b.type === 'hstacked', horiz = b.type === 'hbar' || b.type === 'hstacked', round = b.type === 'pie' || b.type === 'doughnut';
      const datasets = colKeys.length && !round
        ? colKeys.map((c, i) => ({ label: c, data: pivot.data.map(d => d.cols[i]), backgroundColor: PALETTE[i % PALETTE.length], borderColor: PALETTE[i % PALETTE.length], borderRadius: b.type === 'line' ? 0 : 3, tension: .25 }))
        : [{ label: mName, data: pivot.data.map(d => d.total), backgroundColor: round ? PALETTE : '#0F3031', borderColor: '#0F3031', borderRadius: 3, tension: .25, fill: false }];
      mk('b_chart', { type: round ? b.type : b.type === 'line' ? 'line' : 'bar', data: { labels, datasets },
        options: round ? { plugins: { legend: { display: true, position: 'right' } } } : {
          indexAxis: horiz ? 'y' : 'x',
          scales: { x: { stacked, grid: { color: horiz ? '#eef1f0' : 'transparent' } }, y: { stacked, beginAtZero: true, grid: { color: horiz ? 'transparent' : '#eef1f0' } } },
          plugins: { legend: { display: datasets.length > 1, position: 'bottom' } } } }, b.rows, labels);
    }
    render(qs('#b_table', v), pivot.data.length ? html`<table><thead><tr><th>${pivot.rowName}</th>${colKeys.map(c => html`<th class="right">${c}</th>`)}<th class="right">${colKeys.length ? 'Total' : mName}</th></tr></thead><tbody>
      ${pivot.data.map(d => html`<tr><td>${d.k}</td>${d.cols.map(x => html`<td class="right">${x || ''}</td>`)}<td class="right"><b>${d.total}</b></td></tr>`)}</tbody></table>`
      : html`<div class="empty">Nothing to show for this view.</div>`);
  }

  for (const k of ['rows', 'cols', 'measure', 'type', 'sort', 'top']) qs('#b_' + k, v).onchange = e => { A.builder[k] = e.target.value; draw(); };
  qs('#an_cycle', v).onchange = e => { A.cycle = e.target.value; A.filters = {}; if (A.cycle) S.cycleId = A.cycle; adminAnalytics(); };
  qs('#an_pdl', v).onclick = () => pivot && downloadXlsx(`TNA analysis - ${pivot.rowName}.xlsx`, [{ name: 'Analysis',
    rows: pivot.data.map(d => ({ [pivot.rowName]: d.k, ...Object.fromEntries(pivot.colKeys.map((c, i) => [c, d.cols[i]])), [pivot.colKeys.length ? 'Total' : pivot.mName]: d.total })) }]);
  qs('#an_xl', v).onclick = () => downloadXlsx(`TNA filtered data - ${new Date().toISOString().slice(0, 10)}.xlsx`, [{ name: 'TNA Responses',
    rows: filtered().map(r => Object.fromEntries(EXPORT_COLS.map(([h, fn]) => [h, fn(r.raw) ?? '']))) }]);
  draw();
}

boot().catch(e => renderFatal(e.message));

</script>
</body>
</html>
